<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>天气预报 - 北京 & 丹佛</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "KaiTi", "SimKai", "楷体", serif; /* 全局使用楷体 */
    }

    body {
      background: #f2f2f2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: start;
      flex-direction: column;
      padding: 30px;
      color: black;
    }

    .page {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .page.active {
      display: flex;
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      width: 100%;
      margin-top: 20px;
    }

    .weather-card {
      background-color: #d0ecff;
      border-radius: 15px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      padding: 30px 20px;
      text-align: center;
      width: 45%;
      max-width: 500px;
      color: black;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .city {
      font-size: 2em;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .emoji {
      font-size: 3.5em;
      margin-bottom: 5px;
      animation: float 3s infinite ease-in-out;
      display: inline-block;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }

    .wind-wheel-icon {
      font-size: 2.5em;
      display: inline-block;
      animation: windRotate 4s linear infinite;
      vertical-align: middle;
    }

    @keyframes windRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .info {
      font-size: 1.3em;
      line-height: 1.2;
      white-space: pre-line;
      margin-top: 10px;
    }

    .season-tag {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 1em;
      font-weight: bold;
      color: white;
    }

    .summer { background-color: #FF9F0A; } /* 夏季 🟠 */
    .spring { background-color: #34C759; } /* 春季 🟢 */
    .autumn { background-color: #FFD60A; } /* 秋季 🟡 */
    .winter { background-color: #50C8FF; } /* 冬季 🔵 */

    .moon-phase-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 10px;
      font-size: 1.2em;
      font-weight: bold;
      color: black;
    }

    .nav-button {
      padding: 15px 30px;
      font-size: 1.2em;
      font-weight: bold;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 20px auto;
      display: block;
      transition: background 0.3s;
    }

    .nav-button:hover {
      background: #005ECF;
    }

    h1 {
      width: 100%;
      text-align: center;
      font-size: 1.8em;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .weather-card {
        width: 90%;
      }
      .emoji {
        font-size: 3em;
      }
      .info {
        font-size: 1.15em;
      }
      .moon-phase-container {
        font-size: 1em;
      }
      .wind-wheel-icon {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>

  <!-- 第一页：今天 -->
  <section id="todayPage" class="page active">
    <h1>天气预报 - 今天</h1>

    <div class="card-container">

      <!-- 左边：丹佛 -->
      <div class="weather-card">
        <div class="city">📍 丹佛</div>
        <div class="emoji sun">☀️</div>
        <div class="info" id="denverToday"></div>
        <div class="moon-phase-container" id="denverMoonToday">🌕 满月</div>
      </div>

      <!-- 右边：北京 -->
      <div class="weather-card">
        <div class="city">📍 北京</div>
        <div class="emoji rain">🌧️</div>
        <div class="info" id="beijingToday"></div>
        <div class="moon-phase-container" id="beijingMoonToday">🌕 满月</div>
      </div>

    </div>

    <!-- 导航按钮 -->
    <button class="nav-button" onclick="showTomorrow()">明天天气 ➡️</button>
  </section>

  <!-- 第二页：明天 -->
  <section id="tomorrowPage" class="page hidden">
    <h1>天气预报 - 明天</h1>

    <div class="card-container">

      <!-- 左边：丹佛 -->
      <div class="weather-card">
        <div class="city">📍 丹佛</div>
        <div class="emoji cloud">🌤️</div>
        <div class="info" id="denverTomorrow"></div>
        <div class="moon-phase-container" id="denverMoonTomorrow">🌖 下弦月</div>
      </div>

     <!-- 右边：北京 -->
    <div class="weather-card">
      <div class="city">📍 北京</div>
      <div class="emoji cloud">🌤️</div>
      <div class="info" id="beijingTomorrow"></div>
      <div class="moon" id="beijingMoonTomorrow">🌕</div>
    </div>

    <!-- 返回按钮 -->
    <button class="nav-button" onclick="showToday()">⬅️ 返回天气预报</button>
  </section>

  <script>
    // 获取格式化日期
    function getFormattedDate(dateObj, isToday = false) {
      const year = dateObj.getFullYear();
      const month = ('0' + (dateObj.getMonth() + 1)).slice(-2);
      const date = ('0' + dateObj.getDate()).slice(-2);
      const daysOfWeek = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
      const day = daysOfWeek[dateObj.getDay()];
      if (isToday) {
        return `今天是${month}月${date}日 ${day}`;
      }
      return `${year}年${month}月${date}日 ${day}`;
    }

    // 获取本地时间（带时区偏移）
    function getLocalTime(timeZoneOffset) {
      var now = new Date();
      var utcTime = now.getTime() + now.getTimezoneOffset() * 60000;
      var localTime = new Date(utcTime + timeZoneOffset * 3600000);

      var hours = ('0' + localTime.getHours()).slice(-2);
      var minutes = ('0' + localTime.getMinutes()).slice(-2);
      return `${hours}:${minutes}`;
    }

    // 根据月份获取季节
    function getSeason(month) {
      const seasons = ["冬季", "春季", "春季", "春季", "夏季", "夏季", "夏季", "秋季", "秋季", "秋季", "冬季", "冬季"];
      return seasons[month];
    }

    // 获取季节类名
    function getSeasonClass(month) {
      const seasonClasses = ["winter", "spring", "spring", "spring", "summer", "summer", "summer", "autumn", "autumn", "autumn", "winter", "winter"];
      return seasonClasses[month];
    }

    // 获取季节图标
    function getSeasonEmoji(season) {
      switch (season) {
        case "春季": return "🌸";
        case "夏季": return "🌴";
        case "秋季": return "🍁";
        case "冬季": return "❄️";
        default: return "🌿";
      }
    }

    // 主要中国传统节日数据（示例）
    const lunarData = {
      "2025-01-29": "正月初一 · 春节",
      "2025-02-12": "元宵节",
      "2025-04-04": "清明节",
      "2025-05-31": "端午节",
      "2025-10-06": "中秋节",
      "2025-12-14": "腊八节"
    };

    // 精确农历映射表（部分关键日期）
    const lunarCalendar = {
      "2025-05-31": "五月初五",
      "2025-06-01": "五月 初六",
      "2025-06-02": "五月 廿五日",
      "2025-06-03": "五月 廿六日",
      "2025-06-08": "六月 初一日",
      "2025-10-06": "九月 初一",
      "2025-12-14": "冬月 十五日"
    };

    // 获取农历或节日信息
    function getLunarAndFestival(date) {
      const y = date.getFullYear();
      const m = ('0' + (date.getMonth() + 1)).slice(-2);
      const d = ('0' + date.getDate()).slice(-2);
      const key = `${y}-${m}-${d}`;

      if (lunarData[key]) {
        return { label: "🎉 节日：", value: lunarData[key], greeting: "粽叶飘香，端午安康" };
      }

      const lunarKey = `${y}-${date.getMonth()+1}-${date.getDate()}`;
      const lunarStr = lunarCalendar[lunarKey] || calculateDynamicLunar(date);
      return { label: "📅 农历：", value: `${y}年${lunarStr}`, greeting: "" };
    }

    // 动态计算农历（模拟）
    function calculateDynamicLunar(date) {
      const base = new Date('2025-05-27');
      const diffDays = Math.floor((date - base) / (1000 * 60 * 60 * 24));
      const chineseMonths = [
        "正月", "二月", "三月", "四月", "五月", "六月", "七月", "八月",
        "九月", "十月", "冬月", "腊月"
      ];
      const monthIndex = Math.floor(diffDays / 30) % 12;
      const lunarMonthName = chineseMonths[monthIndex];

      const lunarDay = ((diffDays % 29.5305882) + 29.5305882) % 29.5305882;

      if (lunarDay <= 10) {
        return `${lunarMonthName} 初${Math.round(lunarDay)}`;
      } else if (lunarDay <= 20) {
        return `${lunarMonthName} 十${Math.round(lunarDay) % 10 === 0 ? "" : Math.round(lunarDay) % 10}`;
      } else if (lunarDay <= 30) {
        return `${lunarMonthName} 廿${Math.round(lunarDay) % 10 === 0 ? "" : Math.round(lunarDay) % 10}`;
      } else {
        return `${chineseMonths[(monthIndex + 1) % 12]} 初一`;
      }
    }

    // 获取月相图标 + 名称
    function getMoonPhaseWithLabel(date) {
      const newMoonBase = new Date('2025-05-27'); // 上一次新月时间
      const lunarMonth = 29.5305882;

      let diffDays = Math.floor((date - newMoonBase) / (1000 * 60 * 60 * 24));
      let phaseIndex = ((diffDays % lunarMonth + lunarMonth) % lunarMonth) / lunarMonth;

      if (phaseIndex < 0.03 || phaseIndex > 0.97) return { icon: "🌑", name: "新月" };
      else if (phaseIndex < 0.25) return { icon: "🌒", name: "峨眉月" };
      else if (phaseIndex < 0.47) return { icon: "🌓", name: "上弦月" };
      else if (phaseIndex < 0.53) return { icon: "🌕", name: "满月" };
      else if (phaseIndex < 0.75) return { icon: "🌖", name: "下弦月" };
      else if (phaseIndex < 0.97) return { icon: "🌘", name: "残月" };
      else return { icon: "🌗", name: "残月" };
    }

    // 更新今日卡片（带时区）
    function updateTodayCard(idPrefix, data) {
      const infoEl = document.getElementById(idPrefix + "Today");
      const moonContainer = document.getElementById(idPrefix + "MoonToday");

      const today = new Date();
      const todayStr = getFormattedDate(today, true);
      const timeStr = getLocalTime(data.timeZoneOffset);
      const month = today.getMonth(); // 当前月份
      const season = getSeason(month);
      const emoji = getSeasonEmoji(season);
      const seasonClass = getSeasonClass(month);
      const { label: lunarLabel, value: lunarInfo, greeting } = getLunarAndFestival(today);
      const moon = getMoonPhaseWithLabel(today);

      let extraGreeting = "";
      if (greeting && lunarLabel === "🎉 节日：") {
        extraGreeting = `<br><span style="color:#e67e22; font-size:1.2em; font-weight:bold;">${greeting}</span>`;
      }

      infoEl.innerHTML = `
        📌 公历：${todayStr}<br/>
        ${lunarLabel}${lunarInfo}<br/>
        ${extraGreeting}
        🕒 时间：${timeStr}<br/>
        ☁️ 天气：${data.todayCondition}<br/>
        🌡️ 气温：${data.todayTemp}<br/>
        <span><span class="wind-wheel-icon">🌀</span> 风力：${data.todayWind}</span><br/>
        <span class="season-tag ${seasonClass}">${emoji} 季节：${season}</span>
      `;

      moonContainer.innerHTML = `${moon.icon} ${moon.name}`;
    }

    // 更新明日卡片（带时区）
    function updateTomorrowCard(idPrefix, data) {
      const infoEl = document.getElementById(idPrefix + "Tomorrow");
      const moonContainer = document.getElementById(idPrefix + "MoonTomorrow");

      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const tomorrowStr = getFormattedDate(tomorrow);
      const timeStr = getLocalTime(data.timeZoneOffset);
      const month = tomorrow.getMonth(); // 明天的月份
      const season = getSeason(month);
      const emoji = getSeasonEmoji(season);
      const seasonClass = getSeasonClass(month);
      const { label: lunarLabel, value: lunarInfo, greeting } = getLunarAndFestival(tomorrow);
      const moon = getMoonPhaseWithLabel(tomorrow);

      let extraGreeting = "";
      if (greeting && lunarLabel === "🎉 节日：") {
        extraGreeting = `<br><span style="color:#e67e22; font-size:1.2em; font-weight:bold;">${greeting}</span>`;
      }

      infoEl.innerHTML = `
        📌 公历：${tomorrowStr}<br/>
        ${lunarLabel}${lunarInfo}<br/>
        ${extraGreeting}
        🕒 时间：${timeStr}<br/>
        ☁️ 天气：${data.tomorrowCondition}<br/>
        🌡️ 水平：${data.tomorrowTemp}<br/>
        <span><span class="wind-wheel-icon">🌀</span> 风力：${data.tomorrowWind}</span><br/>
        <span class="season-tag ${seasonClass}">${emoji} 季节：${season}</span>
      `;

      moonContainer.innerHTML = `${moon.icon} ${moon.name}`;
    }

    // 静态天气数据（包含今天、明天）
    const weatherData = {
      denver: {
        todayCondition: "晴朗",
        tomorrowCondition: "多云",
        todayTemp: "18°C",
        tomorrowTemp: "20°C",
        todayWind: "微风",
        tomorrowWind: "3级 西北风",
        timeZoneOffset: -6,
      },
      beijing: {
        todayCondition: "小雨",
        tomorrowCondition: "晴转多云",
        todayTemp: "22°C",
        tomorrowTemp: "24°C",
        todayWind: "3级 东北风",
        tomorrowWind: "2级 西南风",
        timeZoneOffset: +8,
      }
    };

    // 页面切换函数
    function showToday() {
      // 清除所有页面的 active 类
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

      // 设置今天页面为 active，隐藏明天页面
      document.getElementById('todayPage').classList.add('active');
      document.getElementById('todayPage').classList.remove('hidden');

      document.getElementById('tomorrowPage').classList.add('hidden');
    }

    function showTomorrow() {
      // 清除所有页面的 active 类
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

      // 设置明天页面为 active，隐藏今天页面
      document.getElementById('tomorrowPage').classList.add('active');
      document.getElementById('tomorrowPage').classList.remove('hidden');

      document.getElementById('todayPage').classList.add('hidden');
    }

    // 页面加载后更新时间和月相
    window.onload = function () {
      updateTodayCard('denver', weatherData.denver);
      updateTodayCard('beijing', weatherData.beijing);
      updateTomorrowCard('denver', weatherData.denver);
      updateTomorrowCard('beijing', weatherData.beijing);
    };
  </script>
</body>
</html>
