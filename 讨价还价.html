<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>中文砍价机器人 😊</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    #chat {
      border: 1px solid #ccc;
      padding: 10px;
      height: 300px;
      overflow-y: auto;
      background-color: white;
      margin-bottom: 10px;
    }
    .user, .bot {
      margin: 5px 0;
    }
    .user {
      color: blue;
      text-align: right;
    }
    .bot {
      color: green;
    }
    input[type="text"] {
      width: 80%;
      padding: 5px;
    }
    button {
      padding: 5px 10px;
    }
    img.product-image {
      display: block;
      margin: 0 auto 20px auto;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<h2 style="text-align:center;">中文砍价机器人 😊</h2>

<!-- 商品图片 -->
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/T-shirt-blank.svg/480px-T-shirt-blank.svg.png" 
     alt="一件衣服"
     class="product-image">

<div id="chat"></div>

<input type="text" id="userInput" placeholder="输入你的中文..." />
<button onclick="sendMessage()">发送</button>

<script>
  const chat = document.getElementById('chat');
  let step = 0; // 当前对话步骤

  function appendMessage(text, className) {
    const div = document.createElement('div');
    div.className = className;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('userInput');
    const userText = input.value.trim();
    if (userText === '') return;

    appendMessage("你：" + userText, 'user');

    switch (step) {
      case 0:
        if (userText.includes("多少钱") || userText.includes("多少")) {
          appendMessage("🤖：500块。", 'bot');
          step++;
        } else {
          appendMessage("🤖：你可以问我“这个多少钱？”哦～", 'bot');
        }
        break;

      case 1:
        if (userText.includes("贵") || userText.includes("便宜")) {
          appendMessage("🤖：可以，400怎么样？", 'bot');
          step++;
        } else {
          appendMessage("🤖：你想买吗？可以试试砍价哦～", 'bot');
        }
        break;

      case 2:
        if (userText.includes("100") && userText.includes("行吗")) {
          appendMessage("🤖：100 不行，150吧？", 'bot');
          step++;
        } else {
          appendMessage("🤖：那你觉得多少钱合适？", 'bot');
        }
        break;

      case 3:
        if (userText.includes("不要了") || userText.includes("我走了")) {
          appendMessage("🤖：你说多少钱？再商量一下嘛～", 'bot');
          step++;
        } else {
          appendMessage("🤖：你要不买啦？再想想咯～", 'bot');
        }
        break;

      case 4:
        if (userText.includes("100")) {
          appendMessage("🤖：好吧，卖给你了！", 'bot');
          step++;
        } else {
          appendMessage("🤖：你刚刚不是说100吗？", 'bot');
        }
        break;

      default:
        appendMessage("🤖：谢谢惠顾，欢迎再来！", 'bot');
        break;
    }

    input.value = '';
  }
</script>

</body>
</html>
