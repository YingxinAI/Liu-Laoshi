<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>刘老师的砍价机器人</title>
  <style>
    body {
      font-family: "KaiTi", "Microsoft YaHei", sans-serif;
      background-color: #e3f2fd;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: row;
      gap: 20px;
      flex-wrap: wrap;
    }

    .header {
      width: 100%;
      text-align: center;
      font-size: 28px;
      color: #d32f2f;
      margin-bottom: 20px;
      font-weight: bold;
      animation: pulseColor 3s infinite;
    }

    @keyframes pulseColor {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.03); }
    }

    .product-container {
      flex: 1;
      min-width: 250px;
      max-width: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .product-container img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .chat-container {
      flex: 2;
      min-width: 300px;
      display: flex;
      flex-direction: column;
    }

    #chat {
      flex: 1;
      border: 1px solid #dce1e6;
      padding: 15px;
      overflow-y: auto;
      background-color: #ffffff;
      height: 300px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .message {
      margin: 6px 0;
      font-size: 16px;
    }

    .user {
      color: #0056d2;
      text-align: right;
    }

    .bot {
      color: #2e7d32;
      text-align: left;
    }

    #inputArea {
      display: flex;
      margin-top: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: "KaiTi", "Microsoft YaHei", sans-serif;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      font-family: "KaiTi", "Microsoft YaHei", sans-serif;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 10px;
    }

    button:hover {
      background-color: #43a047;
    }

    #startBtn, #printBtn {
      display: block;
      margin: 30px auto;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      font-family: "KaiTi", "Microsoft YaHei", sans-serif;
      background: linear-gradient(45deg, #ff7043, #ef5350, #ec407a, #ab47bc);
      background-size: 400% 400%;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      animation: gradientBG 10s ease infinite, pulseScale 2s ease-in-out infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulseScale {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    #startBtn:hover,
    #printBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(255, 100, 100, 0.6);
    }

    #printBtn {
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

<!-- 动态标题 -->
<h1 class="header">👋 欢迎同刘老师的聊天机器人讨价还价</h1>

<!-- 衣服图片区域 -->
<div class="product-container">
  <img src="https://marinaracewear.com/storage/media/attributes/9/0/8/6/5/90865/conversions/1-category.jpg" 
       alt="一件衣服">
</div>

<!-- 聊天对话区域 -->
<div class="chat-container">
  <div id="chat"></div>

  <!-- 开始按钮 -->
  <button id="startBtn" onclick="startChat()">有问题问我</button>

  <!-- 输入框（默认隐藏） -->
  <div id="inputArea" style="display:none;">
    <input type="text" id="userInputField" placeholder="输入你的中文..."
           onkeydown="if(event.key === 'Enter') sendMessage()">
    <button onclick="sendMessage()">发送</button>
  </div>

  <!-- 打印按钮（默认隐藏） -->
  <button id="printBtn" onclick="printChat()">📄 打印聊天记录</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const startBtn = document.getElementById('startBtn');
  const inputArea = document.getElementById('inputArea');
  const userInput = document.getElementById('userInputField');
  const printBtn = document.getElementById('printBtn');

  let step = 0;
  let customerName = '';
  let strategy = null;
  let userPrice = null;

  function getCurrentTime() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    return `[${year}-${month}-${day} ${hours}:${minutes}]`;
  }

  function appendMessage(text, className) {
    const div = document.createElement('div');
    const time = getCurrentTime();

    // 添加顾客 emoji 👨‍💼 或机器人 🤖
    if (className === 'user') {
      div.textContent = `🧑 ${time}: ${text}`;
    } else if (className === 'bot') {
      div.textContent = `🤖 ${time}: ${text}`;
    } else {
      div.textContent = `${time}: ${text}`;
    }

    div.className = 'message ' + className;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function startChat() {
    startBtn.style.display = 'none';
    inputArea.style.display = 'flex';
    appendMessage("您好！我是刘老师的助手，有什么问题可以问我哦～", 'bot');
  }

  function extractName(input) {
    const prefixes = ['我叫', '我是', '我的名字是', '名字是', '叫我'];
    for (let prefix of prefixes) {
      if (input.startsWith(prefix)) {
        input = input.slice(prefix.length);
        break;
      }
    }
    const nameMatch = input.match(/^[\u4e00-\u9fa5]{2,4}/);
    return nameMatch ? nameMatch[0] : input.trim();
  }

  const priceSuggestions = [
    "你觉得多少钱合适呢？",
    "你可以给我一个价格哦～",
    "你想出多少？我可以考虑一下 😊",
    "你说个价吧，我们可以商量。",
    "你希望多少钱买这件衣服？"
  ];

  function getRandomSuggestion() {
    const index = Math.floor(Math.random() * priceSuggestions.length);
    return priceSuggestions[index];
  }

  function sendMessage() {
    const userText = userInput.value.trim();
    if (userText === '') return;

    // 添加带时间的顾客消息
    const time = getCurrentTime();
    appendUserMessage(`🧑 ${time}: ${userText}`);

    if (step === 0) {
      customerName = extractName(userText);
      appendBotMessage(`🤖 ${time}: ${customerName}您好！有什么我可以帮您的吗？`);
      step++;
    } else if (step === 1) {
      if (userText.includes("问题") || userText.includes("帮助")) {
        appendBotMessage(`🤖 ${time}: 您可以问我价格、讲价，或者看看有没有优惠哦～`);
      } else if (userText.includes("多少钱") || userText.includes("多少")) {
        appendBotMessage(`🤖 ${time}: 这件衣服500块。`);
        step++;
      } else {
        appendBotMessage(`🤖 ${time}: 您可以问这件衣服多少钱哦～`);
      }
    } else if (step === 2) {
      if (userText.includes("贵") || userText.includes("便宜")) {
        strategy = Math.random() < 0.5 ? 1 : 2;
        if (strategy === 1) {
          appendBotMessage(`🤖 ${time}: 可以，便宜点，400块怎么样？`);
        } else {
          appendBotMessage(`🤖 ${time}: 可以，你说多少钱？`);
        }
        step++;
      } else {
        appendBotMessage(`🤖 ${time}: 你想买吗？可以试试砍价哦～`);
      }
    } else if (step === 3) {
      if (strategy === 1 && userText.includes("400") && userText.includes("贵")) {
        appendBotMessage(`🤖 ${time}: 400还太贵，你说多少钱？`);
        strategy = 3;
        step++;
      } else if (/^\d+$/.test(userText)) {
        userPrice = parseInt(userText);
        if (userPrice >= 400) {
          appendBotMessage(`🤖 ${time}: 谢谢惠顾！`);
        } else if (userPrice >= 200) {
          appendBotMessage(`🤖 ${time}: 可以！成交！`);
        } else {
          appendBotMessage(`🤖 ${time}: 那我最低卖200块，可以吗？`);
          strategy = 4;
          step++;
        }
        showPrintButtonIfEnd(userText);
      } else {
        appendBotMessage(`🤖 ${time}: ` + getRandomSuggestion());
      }
    } else if (step === 4) {
      if (userText.includes("好") || userText.includes("可以")) {
        appendBotMessage(`🤖 ${time}: 好的，成交！`);
      } else {
        appendBotMessage(`🤖 ${time}: 那就按你的价格来吧！`);
      }
      showPrintButtonIfEnd(userText);
      step++;
    } else {
      appendBotMessage(`🤖 ${time}: 谢谢惠顾，欢迎再来！`);
      showPrintButtonIfEnd(userText);
    }

    userInput.value = '';
  }

  function appendUserMessage(message) {
    const div = document.createElement('div');
    div.className = 'message user';
    div.textContent = message;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function appendBotMessage(message) {
    const div = document.createElement('div');
    div.className = 'message bot';
    div.textContent = message;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function showPrintButtonIfEnd(text) {
    if (
      text.includes("再见") ||
      text.includes("谢谢") ||
      text.includes("成交") ||
      text.includes("走") ||
      text.includes("拜拜")
    ) {
      printBtn.style.display = 'block';
    }
  }

  function printChat() {
    const now = new Date();
    const dateStr = `${now.getFullYear()}年${String(now.getMonth()+1).padStart(2,'0')}月${String(now.getDate()).padStart(2,'0')}日`;
    const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

    const chatContent = chat.innerText;
    const printWindow = window.open('', '_blank');
    printWindow.document.write(`
      <html>
        <head><title>${customerName} 的聊天记录</title></head>
        <body>
          <h2>${customerName} 的聊天记录</h2>
          <p>日期：${dateStr}</p>
          <p>时间：${timeStr}</p>
          <pre>${chatContent}</pre>
        </body>
      </html>
    `);
    printWindow.document.close();
    printWindow.print();
  }
</script>

</body>
</html>
