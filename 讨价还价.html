<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>刘老师的砍价机器人</title>
  <style>
    body {
      font-family: "KaiTi", "Microsoft YaHei", sans-serif;
      background-color: #e3f2fd;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: row;
      gap: 20px;
      flex-wrap: wrap;
    }

    .header-container {
      width: 100%;
      text-align: center;
      margin-bottom: 20px;
    }

    .main-title {
      font-size: 28px;
      color: #d32f2f;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emoji-swing {
      display: inline-block;
      animation: swing 2s ease-in-out infinite;
      margin-right: 6px;
      margin-left: 6px;
    }

    @keyframes swing {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(15deg); }
      50% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
      100% { transform: rotate(0deg); }
    }

    .emoji-breathe {
      display: inline-block;
      animation: breathe 2s infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.6; }
    }

    .chat-date {
      font-size: 14px;
      color: #757575;
      margin-top: 4px;
      display: block;
    }

    .product-container {
      flex: 1;
      min-width: 250px;
      max-width: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .product-container img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .chat-container {
      flex: 2;
      min-width: 300px;
      display: flex;
      flex-direction: column;
    }

    #chat {
      flex: 1;
      border: 1px solid #dce1e6;
      padding: 15px;
      overflow-y: auto;
      background-color: #ffffff;
      height: 300px;
      display: flex;
      flex-direction: column;
    }

    .message {
      margin: 6px 0;
      font-size: 16px;
    }

    .user {
      color: #0056d2;
      text-align: right;
    }

    .bot {
      color: #2e7d32;
      text-align: left;
    }

    #inputArea {
      display: flex;
      margin-top: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: "KaiTi", "Microsoft YaHei", sans-serif;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      font-family: "KaiTi", "Microsoft YaHei", sans-serif;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 10px;
    }

    button:hover {
      background-color: #43a047;
    }

    /* 动态按钮样式 */
    #startBtn, #printBtn {
      display: block;
      margin: 30px auto;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(45deg, #ff7043, #ef5350, #ec407a, #ab47bc);
      background-size: 400% 400%;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      animation: gradientBG 10s ease infinite, pulseScale 2s ease-in-out infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulseScale {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* 新增：按钮中🤔表情也摇摆 */
    #startBtn .emoji-swing {
      animation: swing 2s ease-in-out infinite;
    }

    #printBtn {
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

<!-- 页面标题 -->
<div class="header-container">
  <h1 class="main-title">
    <span class="emoji-swing">👋</span>
    <span style="margin: 0 6px;">你好！让我们一起同刘老师的聊天机器人讨价还价吧</span>
    <span class="emoji-breathe">🤑</span>
  </h1>
  <span id="chatDate" class="chat-date"></span>
</div>

<script>
  const now = new Date();
  const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  document.getElementById('chatDate').textContent = '📅 今天是：' + dateStr;
</script>

<!-- 衣服图片区域 -->
<div class="product-container">
  <img src="TS.png" 
       alt="一件衣服">
</div>

<!-- 聊天窗口 -->
<div class="chat-container">
  <div id="chat"></div>
  <button id="startBtn" onclick="startChat()">
    <span class="emoji-swing">🤔</span>
    有问题我问
  </button>
  <div id="inputArea" style="display:none;">
    <input type="text" id="userInputField" placeholder="输入你的中文..."
           onkeydown="if(event.key === 'Enter') sendMessage()" />
    <button onclick="sendMessage()">发送</button>
  </div>
  <button id="printBtn" onclick="printChat()" style="display:none;">📄 打印聊天记录</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const startBtn = document.getElementById('startBtn');
  const inputArea = document.getElementById('inputArea');
  const userInput = document.getElementById('userInputField');
  const printBtn = document.getElementById('printBtn');

  let step = 0;
  let customerName = '';
  let userPrice = null;

  function appendMessage(text, className) {
    const div = document.createElement('div');
    div.className = 'message ' + className;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function extractName(input) {
    const prefixes = ['我叫', '我是','你好', '我的名字是', '名字是', '叫我'];
    for (let prefix of prefixes) {
      if (input.startsWith(prefix)) {
        input = input.slice(prefix.length).trim();
        break;
      }
    }

    const nameMatch = input.match(/^[\u4e00-\u9fa5]{2,4}/);
    return nameMatch ? nameMatch[0] : input.trim();
  }

  function isEndStatement(text) {
    const endings = ["再见", "谢谢", "成交", "拜拜"];
    return endings.some(end => text.includes(end));
  }

  function isPrice(text) {
    return /^\d+$/.test(text.replace(/[^\d]/g, ''));
  }

  function getPrice(text) {
    return parseInt(text.replace(/[^\d]/g, ''), 10);
  }

  function startChat() {
    startBtn.style.display = 'none';
    inputArea.style.display = 'flex';
    appendMessage("🤖：您好！我是刘老师的助手，你叫什么名字？～", 'bot');
  }

  function sendMessage() {
    const userText = userInput.value.trim().toLowerCase();
    if (userText === '') return;

    // 添加顾客消息
    appendMessage("🧑：" + userText, 'user');

    // 自动结束语句判断
    if (isEndStatement(userText)) {
      appendMessage("🤖：不客气，欢迎下次再来！", 'bot');
      showPrintButton();
      userInput.value = '';
      return;
    }

    // 开始对话流程
    if (step === 0) {
      customerName = extractName(userText);
      appendMessage(`🤖：你好${customerName}！你有什么问题问吗？`, 'bot');
      step++;
    } else if (step === 1) {
      if (userText.includes("多少钱") || userText.includes("多少")) {
        appendMessage("🤖：这件衣服500块钱", 'bot');
        step++;
      } else {
        appendMessage("🤖：你有什么问题，可以问我～", 'bot');
      }
    } else if (step === 2) {
      if (userText.includes("贵") || userText.includes("便宜")) {
        appendMessage("🤖：可以，450块，怎么样？", 'bot');
        step++;
      } else {
        appendMessage("🤖：你想买吗？我可以便宜一点～", 'bot');
      }
    } else if (step === 3) {
      if (userText.includes("450") && userText.includes("贵")) {
        appendMessage("🤖：450还太贵，你说多少钱？", 'bot');
        step++;
      } else if (isPrice(userText)) {
        userPrice = getPrice(userText);
        if (userPrice > 200 && userPrice < 450) {
          appendMessage(`🤖：我可以给你${userPrice}块`, 'bot');
          appendMessage("🤖：不客气，欢迎下次再来！", 'bot');
          showPrintButton();
          step++;
        } else if (userPrice <= 200) {
          appendMessage(`🤖：${userPrice} 不可以，太便宜了。我可以给你300块，怎么样？`, 'bot');
          step++;
        } else if (userPrice >= 450) {
          appendMessage("🤖：谢谢！", 'bot');
          step++;
        }
      } else {
        appendMessage("🤖：你说得多少钱？", 'bot');
      }
    } else if (step === 4) {
      if (userText.includes("300") && userText.includes("贵")) {
        appendMessage("🤖：我最低卖200块，好吗？", 'bot');
        step++;
      } else if (userText.includes("不要") || userText.includes("走了")) {
        appendMessage("🤖：那我最低卖200块，好吗？", 'bot');
        step++;
      } else if (isPrice(userText)) {
        userPrice = getPrice(userText);
        if (userPrice >= 200) {
          appendMessage(`🤖：好的，${userPrice}块成交！`, 'bot');
          appendMessage("🤖：不客气，欢迎下次再来！", 'bot');
          showPrintButton();
          step++;
        } else {
          appendMessage("🤖：我最低200块，好吗？", 'bot');
        }
      } else {
        appendMessage("🤖：你说多少钱？，我们可以讨价还价 😊", 'bot');
      }
    } else if (step === 5) {
      if (userText.includes("好") || userText.includes("可以")) {
        appendMessage("🤖：好的，成交！", 'bot');
        appendMessage("🤖：不客气，欢迎下次再来！", 'bot');
        showPrintButton();
        step++;
      } else if (isPrice(userText)) {
        userPrice = getPrice(userText);
        if (userPrice >= 200) {
          appendMessage(`🤖：好的，${userPrice}块成交！`, 'bot');
          appendMessage("🤖：不客气，欢迎下次再来！", 'bot');
          showPrintButton();
          step++;
        } else {
          appendMessage("🤖：最低200块，好吗？", 'bot');
        }
      } else {
        appendMessage("🤖：那就200块来吧，可以吗？", 'bot');
      }
    } else {
      appendMessage("🤖：感谢光临，我们下次见！", 'bot');
      showPrintButton();
    }

    userInput.value = '';
  }

  function showPrintButton() {
    printBtn.style.display = 'block';
  }

  function printChat() {
    const chatContent = chat.innerText;
    const title = document.querySelector('.main-title').innerText;
    const date = document.getElementById('chatDate').innerText;

    const printWindow = window.open('', '_blank');
    printWindow.document.write(`
      <html>
        <head><title>聊天记录</title></head>
        <body>
          <h2>${title}</h2>
          <p>${date}</p>
          <pre>${chatContent}</pre>
        </body>
      </html>
    `);
    printWindow.document.close();
    printWindow.print();
  }
</script>

</body>
</html>
