<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老外中文拼音大挑战 - Pinyin Challenge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
        .font-game {
            font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
        }
        /* 3D 赛道透气 */
        .road-container {
            perspective: 800px;
        }
        .road {
            transform: rotateX(72deg); /* 更加扁平的旋转角度，将蓝色垫子下拉 */
            transform-origin: bottom center;
            background: linear-gradient(to top, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
        }
        /* 抖动动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(-1deg); }
            20%, 60% { transform: translateX(-10px) rotate(-3deg); }
            40%, 80% { transform: translateX(10px) rotate(1deg); }
        }
        .shake-error {
            animation: shake 0.4s ease-in-out;
        }
        /* 弹幕浮动动画 */
        @keyframes float-up {
            0% { transform: translateY(20px) scale(0.8); opacity: 0; }
            20% { transform: translateY(0px) scale(1.1); opacity: 1; }
            80% { transform: translateY(-10px) scale(1); opacity: 1; }
            100% { transform: translateY(-30px) scale(0.9); opacity: 0; }
        }
        .feedback-pop {
            animation: float-up 1.5s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 🧱 拼音展示区左右滑开门过渡效果 (物理滑门关闭与开启均需要 0.6s 硬件加速) */
        #wall-gate-left {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #wall-gate-right {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* ✨ 闪烁脉冲动画：大门未开启时，拼音和图片会不断轻柔闪烁呼吸 */
        @keyframes text-pulse-blink {
            0%, 100% { opacity: 0.35; text-shadow: 0 0 8px rgba(255,255,255,0.2); }
            50% { opacity: 1.0; text-shadow: 0 0 24px rgba(255,255,255,0.9); }
        }
        @keyframes emoji-pulse-blink {
            0%, 100% { opacity: 0.12; transform: scale(0.96); }
            50% { opacity: 0.45; transform: scale(1.04); }
        }
        .pinyin-blinking {
            animation: text-pulse-blink 1.4s infinite ease-in-out !important;
        }
        .emoji-blinking {
            animation: emoji-pulse-blink 1.4s infinite ease-in-out !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-2 sm:p-4 font-sans select-none overflow-hidden">

    <!-- 主容器：手机长宽比 -->
    <div class="relative w-full max-w-md h-[92vh] max-h-[850px] bg-slate-950 rounded-3xl border-4 border-slate-700 shadow-2xl flex flex-col overflow-hidden">
        
        <!-- 背景：摄像头画面 / 备用渐变背景 -->
        <div class="absolute inset-0 z-0">
            <!-- 摄像头轨道 -->
            <video id="webcam" class="w-full h-full object-cover scale-x-[-1] opacity-60 hidden" autoplay playsinline></video>
            <!-- 备用渐变背景 -->
            <div id="fallback-bg" class="w-full h-full bg-gradient-to-b from-indigo-950 via-purple-950 to-slate-950 flex flex-col justify-between p-6">
                <!-- 星空粒子效果 -->
                <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:16px_16px]"></div>
            </div>
        </div>

        <!-- 游戏层：采用纯 Flex 垂直流式布局，自适应间距，杜绝重叠 -->
        <div class="relative z-10 flex flex-col h-full justify-between p-3 sm:p-4 pointer-events-none">
            
            <!-- 1. 顶部栏：整合得分、玩家实时头像、生命值 -->
            <div class="p-3 bg-black/60 rounded-2xl border border-slate-800 backdrop-blur-md pointer-events-auto flex justify-between items-center w-full z-30">
                <!-- 左：得分 -->
                <div class="flex items-center space-x-2">
                    <div class="flex items-center space-x-1 bg-black/30 px-2 py-1 rounded-xl border border-slate-700/20">
                        <i data-lucide="trophy" class="text-amber-400 w-4 h-4"></i>
                        <span class="font-game text-xs tracking-wider">得分: <span id="score" class="text-yellow-300">0</span></span>
                    </div>
                    <!-- 随时重来按钮 -->
                    <button id="btn-restart-mid" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 p-1.5 rounded-xl border border-slate-700/50 transition-all flex items-center justify-center" title="重新开始">
                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 text-cyan-400"></i>
                    </button>
                </div>
                
                <!-- 中：玩家实时 live 摄像头头像 (无文本提示气泡，纯净专注头像) -->
                <div class="relative w-14 h-14 rounded-full border-2 border-emerald-500 overflow-hidden bg-slate-800 shadow-inner flex items-center justify-center pointer-events-auto">
                    <video id="webcam-avatar" class="w-full h-full object-cover scale-x-[-1]" autoplay playsinline></video>
                    <!-- 默认备用小图标 (没开摄像头时显示) -->
                    <div id="avatar-fallback" class="absolute inset-0 flex items-center justify-center bg-slate-800 transition-opacity duration-300">
                        <i data-lucide="user" class="text-slate-400 w-6 h-6"></i>
                    </div>
                </div>

                <!-- 右：生命值 -->
                <div class="flex space-x-0.5 bg-black/30 px-2 py-1 rounded-xl border border-slate-700/20" id="hearts-container">
                    <i data-lucide="heart" class="text-rose-500 fill-rose-500 w-4 h-4"></i>
                    <i data-lucide="heart" class="text-rose-500 fill-rose-500 w-4 h-4"></i>
                    <i data-lucide="heart" class="text-rose-500 fill-rose-500 w-4 h-4"></i>
                </div>
            </div>

            <!-- 2. 中间主区域：使用自然流自适应布局，拒绝绝对位置重叠 -->
            <div class="flex-1 flex flex-col items-center justify-between py-2.5 relative w-full overflow-hidden">
                <!-- 趣味浮动文字反馈 -->
                <div id="text-feedback-container" class="absolute top-2 w-full flex flex-col items-center pointer-events-none z-40"></div>

                <!-- 【上部展示群组】：自上而下自适应排列，加大了间距以适应大卡片 -->
                <div class="w-full flex flex-col items-center space-y-4 px-1.5 pointer-events-auto z-20">
                    
                    <!-- 橘黄色显示区 (横向完美拉宽至 max-w-[424px]，垂直高度保持不变，大圆角 rounded-3xl) -->
                    <div id="orange-display-card" class="w-full max-w-[424px] bg-gradient-to-r from-amber-500 to-orange-600 border-4 border-white rounded-3xl shadow-2xl p-3 text-center transform -rotate-1 relative transition-all duration-300">
                        <!-- 进度条 -->
                        <div class="absolute top-0 left-0 h-1.5 bg-yellow-400 rounded-full transition-all duration-100 ease-linear" id="timer-bar" style="width: 100%;"></div>
                        
                        <div class="text-[10px] font-semibold tracking-widest text-yellow-100 uppercase mt-1">请大声读出</div>
                        
                        <!-- 拼音置于图片之上布局且具有“左右拉门式隔离墙门”（高度保持 h-48 不变） -->
                        <div class="relative flex items-center justify-center h-48 my-2 overflow-hidden rounded-2xl border border-amber-700/30 bg-amber-950/20 px-2">
                            <!-- 对应物品大图片/Emoji (半透明背景，尺寸 text-[10rem]，初始添加呼吸闪烁) -->
                            <div id="target-emoji" class="text-[10rem] leading-none select-none opacity-25 transition-all duration-300 transform scale-100 emoji-blinking">🥔</div>
                            <!-- 对应的拼音文本（覆盖在Emoji上方，强阴影，添加 whitespace-nowrap 强制不换行，初始添加呼吸闪烁) -->
                            <div id="target-pinyin" class="absolute text-5xl font-black text-white tracking-widest drop-shadow-[0_4px_8px_rgba(0,0,0,0.95)] font-game z-10 transition-all duration-300 whitespace-nowrap px-1 pinyin-blinking">tǔ dòu</div>

                            <!-- 🧱 左右拉门式堵门墙 (左侧门) —— 完美硬件加速动画，开局完全遮挡 -->
                            <div id="wall-gate-left" class="absolute top-0 left-0 w-1/2 h-full bg-gradient-to-r from-orange-700 to-orange-850 border-r-2 border-orange-950 z-20 grid grid-rows-3 grid-cols-2 gap-0.5 p-1">
                                <div class="bg-orange-600 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-750 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-750 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-600 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-600 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-750 rounded-sm border border-orange-900/40"></div>
                            </div>

                            <!-- 🧱 左右拉门式堵门墙 (右侧门) —— 完美硬件加速动画，开局完全遮挡 -->
                            <div id="wall-gate-right" class="absolute top-0 right-0 w-1/2 h-full bg-gradient-to-l from-orange-700 to-orange-850 border-l-2 border-orange-950 z-20 grid grid-rows-3 grid-cols-2 gap-0.5 p-1">
                                <div class="bg-orange-750 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-600 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-600 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-750 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-750 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-600 rounded-sm border border-orange-900/40"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 提示部分 -->
                    <div id="mat-hints" class="flex justify-center space-x-2 text-[10px] text-blue-100 bg-blue-950/85 py-1 px-3 rounded-full border border-blue-400/30 backdrop-blur-md">
                        <span>字数: <strong id="word-len" class="text-yellow-300 font-bold">2</strong></span>
                        <span>•</span>
                        <span class="text-cyan-200 font-medium">提示：读准声调与发音</span>
                    </div>

                </div>

                <!-- 【下部赛道群组】：蓝色垫子移至最底部，不设置静态重叠砖墙 -->
                <div class="relative w-full h-24 flex items-center justify-center mt-auto pointer-events-auto">
                    <!-- 3D 道路 (蓝色垫子) -->
                    <div class="road-container absolute inset-0 w-full h-full flex justify-center overflow-hidden pointer-events-none">
                        <div class="road w-[150%] h-[80px] border-t-4 border-yellow-400/50 flex flex-col justify-between p-2">
                            <!-- 车道线 -->
                            <div class="w-full h-full border-l-4 border-r-4 border-dashed border-white/30 flex justify-center">
                                <div class="w-1 h-full bg-white/20"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 爆炸特效爆出物 (答对时直接在蓝色跑道上爆出来) -->
                    <div id="victory-item" class="absolute bottom-6 z-30 text-8xl transition-all duration-700 transform scale-0 opacity-0 pointer-events-none flex flex-col items-center">
                        <span id="victory-emoji">🥔</span>
                        <span id="victory-text" class="text-2xl font-black bg-black/85 px-4 py-1 rounded-full text-yellow-300 mt-2 border border-yellow-400 font-game shadow-lg">tǔ dòu</span>
                    </div>
                </div>
            </div>

            <!-- 3. 底部控制栏：控制台、麦克风指示、手动操作 -->
            <div class="p-4 bg-gradient-to-t from-black/90 via-black/70 to-transparent space-y-3 pb-8 pointer-events-auto">
                
                <!-- 教师/学生操作区域 -->
                <div class="flex justify-between items-center gap-2 w-full">
                    <!-- 左：手动判定错 -->
                    <button id="btn-wrong" class="flex-1 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white py-3 rounded-2xl flex items-center justify-center space-x-1 font-bold shadow-lg transition-all border-b-4 border-rose-800">
                        <i data-lucide="x-circle"></i>
                        <span>判定错 (Esc)</span>
                    </button>
                    <!-- 中：切换裁判/语音模式 -->
                    <button id="btn-mode-toggle" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-2xl flex items-center justify-center shadow-lg transition-all" title="切换模式">
                        <i data-lucide="mic" id="mode-icon"></i>
                    </button>
                    <!-- 右：手动判定对 -->
                    <button id="btn-correct" class="flex-[1.5] bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white py-3 rounded-2xl flex items-center justify-center space-x-1 font-bold shadow-lg transition-all border-b-4 border-emerald-700">
                        <i data-lucide="check-circle"></i>
                        <span>判定对 (Space)</span>
                    </button>

                    <!-- 学生语音模式提示条 (纯展示指示栏) -->
                    <div id="voice-status-container" class="hidden flex-1 bg-gradient-to-r from-indigo-600 to-blue-500 text-white py-3 px-4 rounded-2xl flex items-center justify-center space-x-2 font-bold shadow-lg border-b-4 border-indigo-800 animate-pulse">
                        <span class="relative flex h-2.5 w-2.5">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-white"></span>
                        </span>
                        <span id="voice-status-lbl" class="text-sm font-game tracking-wider">🎤 请大声读出拼音...</span>
                    </div>
                </div>

                <div class="text-[10px] text-center text-slate-400">
                    语音识别仅支持 Chrome/Edge 浏览器。支持教师手动裁判模式。
                </div>
            </div>
        </div>

        <!-- 遮罩层：游戏未开始 / 游戏成功 / 失败 -->
        <div id="overlay-screen" class="absolute inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-between p-6 text-center font-game">
            
            <!-- 顶部装饰 -->
            <div class="mt-8">
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-orange-400 to-red-500 tracking-wider font-game drop-shadow-md">
                    拼音大挑战
                </h1>
                <p class="text-sm text-slate-400 mt-2 uppercase tracking-widest">Pinyin Challenge Game</p>
            </div>

            <!-- 主内容区 -->
            <div id="overlay-content" class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
                <div class="text-5xl" id="overlay-emoji">🎮</div>
                <h2 class="text-2xl font-bold text-white font-game" id="overlay-title">挑战开始！</h2>
                <div id="overlay-desc" class="text-sm text-slate-300 leading-relaxed font-sans">
                    请大声读出屏幕上的拼音。如果发音和声调都正确，滑动的挡门墙就会开启！
                </div>

                <!-- 游戏配置 -->
                <div class="space-y-3 pt-2 text-left font-sans" id="game-setup">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">选择词库类型</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="cat-btn py-2.5 px-3 rounded-xl border-2 border-yellow-500 bg-yellow-500/10 text-yellow-300 text-sm font-semibold transition-all flex items-center justify-center space-x-1" data-cat="veggies">
                            <span>🥔 蔬菜水果</span>
                        </button>
                        <button class="cat-btn py-2.5 px-3 rounded-xl border-2 border-slate-700 hover:border-slate-500 bg-slate-800/50 text-slate-300 text-sm font-semibold transition-all flex items-center justify-center space-x-1" data-cat="animals">
                            <span>🦁 趣味动物</span>
                        </button>
                    </div>
                    
                    <div class="flex items-center space-x-2 pt-2">
                        <input type="checkbox" id="use-camera" class="w-4 h-4 rounded text-blue-600 bg-slate-800 border-slate-700 focus:ring-blue-500" checked>
                        <label for="use-camera" class="text-xs text-slate-300 cursor-pointer">开启摄像头头像</label>
                    </div>
                </div>
            </div>

            <!-- 开始/重来按钮 -->
            <button id="btn-start" class="w-full max-w-xs bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-500 hover:to-amber-600 active:scale-95 text-slate-950 font-black text-xl py-4 rounded-2xl shadow-lg shadow-yellow-500/20 tracking-widest transition-all mb-8 border-b-4 border-amber-700 flex items-center justify-center space-x-2 font-game">
                <i data-lucide="play-circle" class="w-6 h-6 fill-current"></i>
                <span id="btn-start-text">开始挑战</span>
            </button>
        </div>

    </div>

    <!-- 脚本逻辑 -->
    <script>
        // 游戏词库数据
        const wordBanks = {
            veggies: [
                { 
                    word: '土豆', pinyin: 'tǔ dòu', emoji: '🥔',
                    accept: ['土豆', '土逗', '图豆', '吐逗'],
                    tones: {
                        '吐 du': '声调不对！土豆的 tǔ 是 3 声调，dòu 是 4 声调哦！',
                        '吐都': '声调不对！土豆的 tǔ 是 3 声调，dòu 是 4 声调哦！',
                        '兔兜': '声调不准！土豆(tǔ dòu)的 tǔ 是 3 声调，dòu 是 4 声调哦！',
                        '图都': '注意声调！土豆的 tǔ 是 3 声调哦！',
                        '图豆': '声调不对！土豆的 tǔ 是 3 声调，不要读成 2 声调的图哦！',
                        '吐豆': '声调不对！土豆的 tǔ 是 3 声调，不要读成 4 声调的吐哦！'
                    }
                },
                { 
                    word: '西兰花', pinyin: 'xī lán huā', emoji: '🥦',
                    accept: ['西兰花', '希兰花', '吸兰花', '希腊花', '锡兰花'],
                    tones: {
                        '西蓝画': '注意声调！西兰花(xī lán huā)的 xī 是 1 声调，lán 是 2 声调，huā 是 1 声调！最后一个字不可读成 4 声调画哦！',
                        '西蓝花儿': '不要读成儿化音哦！',
                        '细兰花': '声调不对！西兰花(xī lán huā)的 xī 是 1 声调，不要读成 4 声调细哦！',
                        '喜兰花': '声调不对！西兰花(xī lán huā)的 xī 是 1 声调，不要读成 3 声调喜哦！'
                    }
                },
                { 
                    word: '西红柿', pinyin: 'xī hóng shì', emoji: '🍅',
                    accept: ['西红柿', '西红市', '吸红柿', '希红柿'],
                    tones: {
                        '西红十': '注意声调！西红柿(xī hóng shì)的 xī 是 1 声调，hóng 是 2 声调，shì 是 4 声调！不是 2 声调十(shí)哦！',
                        '细红柿': '声调不对！西红柿(xī hóng shì)的 xī 是 1 声调，不可读成 4 声调细哦！',
                        '洗红柿': '声调不对！西红柿(xī hóng_shì)的 xī 是 1 声调，不可读成 3 声调洗哦！'
                    }
                },
                { 
                    word: '西瓜', pinyin: 'xī guā', emoji: '🍉',
                    accept: ['西瓜', '希瓜', '吸瓜'],
                    tones: {
                        '细挂': '声调不对！西瓜(xī guā)都是 1 声调哦，不可读成 4 声调！',
                        '西挂': '注意声调！西瓜(xī guā)的 guā 是 1 声调哦！'
                    }
                },
                { 
                    word: '香蕉', pinyin: 'xiāng jiāo', emoji: '🍌',
                    accept: ['香蕉', '相蕉', '向蕉', '乡蕉', '香交'],
                    tones: {
                        '想叫': '声调不准！香蕉(xiāng jiāo)都是 1 声调(平声)哦！',
                        '相脚': '注意声调！香蕉(xiāng jiāo)的 xiāng 是 1 声调，jiāo 是 1 声调！不可读成 3 声调脚哦！',
                        '想焦': '注意声调！香蕉(xiāng jiāo)的 xiāng 是 1 声调哦！'
                    }
                },
                { 
                    word: '胡萝卜', pinyin: 'hú luó bo', emoji: '🥕',
                    accept: ['胡萝卜', '红萝卜', '糊萝卜', '胡罗卜', '红罗卜'],
                    tones: {
                        '户落破': '声调偏重！胡萝卜(hú luó bo)中 hú 是 2 声调，luó 是 2 声调，bo 是轻声哦！',
                        '虎萝卜': '声调不对！胡萝卜的 hú 是 2 声调，不可读成 3 声调虎(hǔ)哦！'
                    }
                },
                { 
                    word: '玉米', pinyin: 'yù mǐ', emoji: '🌽',

        // 声音播放
        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.warn('AudioContext not supported');
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'explosion') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.5);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'slide') {
                // 🔊 浑厚的滑动门声效
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(75, now);
                osc.frequency.linearRampToValueAtTime(130, now + 0.5);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'fanfare') {
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const oscNote = audioCtx.createOscillator();
                    const gainNote = audioCtx.createGain();
                    oscNote.connect(gainNote);
                    gainNote.connect(audioCtx.destination);
                    oscNote.type = 'sine';
                    oscNote.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gainNote.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gainNote.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.4);
                    oscNote.start(now + idx * 0.08);
                    oscNote.stop(now + idx * 0.08 + 0.5);
                });
            }
        }

        // 初始化语音识别
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.warn('Speech Recognition not supported in this browser.');
                enableManualMode(true);
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'zh-CN';

            recognition.onstart = () => {
                isListening = true;
            };

            recognition.onerror = (e) => {
                // 过滤无害的 aborted 和 no-speech 错误，防范控制台报错
                if (e.error === 'aborted' || e.error === 'no-speech') {
                    return;
                }
                console.error('Speech recognition error:', e.error);
            };

            recognition.onend = () => {
                isListening = false;
                if (isPlaying && !isManualMode) {
                    // 增加 300 毫秒的延时缓冲再重启，避免麦克风锁冲突导致 aborted 报错
                    setTimeout(() => {
                        if (isPlaying && !isManualMode && !isListening) {
                            try {
                                recognition.start();
                            } catch (e) {
                                if (e.name !== 'InvalidStateError') {
                                    console.error('Speech start retry error:', e);
                                }
                            }
                        }
                    }, 300);
                }
            };

            recognition.onresult = (event) => {
                if (!isPlaying || isManualMode) return;

                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                if (interimTranscript.length > 0 || finalTranscript.length > 0) {
                    const text = finalTranscript || interimTranscript;
                    
                    // 去除多余标点和空格
                    const cleanText = text.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。！，\s]/g, "");
                    checkSpeechAnswer(cleanText);
                }
            };
        }

        // 检验拼音发音以及声调
        function checkSpeechAnswer(speechText) {
            if (isTransitioning) return; // 过渡期间不处理新的语音输入
            const currentItem = currentWords[currentWordIndex];
            if (!currentItem) return;

            // 🌟 核心提升：强制优先进行严格的四声调报错匹配，不给“混过去”的机会！
            for (let errorWord in currentItem.tones) {
                if (speechText.includes(errorWord)) {
                    handleWrongAnswer(currentItem.tones[errorWord]); 
                    return;
                }
            }

            // 2. 然后再进行完全对的判定
            const isMatched = speechText.includes(currentItem.word) || 
                              (currentItem.accept && currentItem.accept.some(val => speechText.includes(val)));

            if (isMatched) {
                handleCorrectAnswer();
                return;
            }

            // 声调或拼音完全不着边际
            if (speechText.length >= currentItem.word.length) {
                handleWrongAnswer();
            }
        }

        // 创建飘字反馈
        function spawnFeedbackText(isCorrect, customText = "") {
            elements.textFeedbackContainer.innerHTML = '';

                feedbackText = customText || teasePool[Math.floor(Math.random() * teasePool.length)];
                textSpan.className = "feedback-pop text-lg font-black px-4 py-2 bg-rose-600 text-white rounded-full border-2 border-white shadow-lg font-game tracking-wide text-center max-w-[90%]";
            }

            textSpan.innerText = feedbackText;
            elements.textFeedbackContainer.appendChild(textSpan);

            setTimeout(() => {
                textSpan.remove();
            }, 2000);
        }

        // 格式化拼音显示：首字母大写
        function formatPinyinForDisplay(pinyinStr) {
            if (!pinyinStr) return "";
            const parts = pinyinStr.trim().split(/\s+/);
            return parts.map((part, index) => {
                if (index === 0) {
                    return part.charAt(0).toUpperCase() + part.slice(1);
                }
                return part;
            }).join(' ');
        }

                    e.preventDefault();
                    handleCorrectAnswer();
                } else if (e.code === 'Escape') {
                    e.preventDefault();
                    handleWrongAnswer();
                }
            });

                        console.error('Speech start error:', e);
                    }

            }
        }

            if (elements.useCamera.checked) {
                startWebcam();

            enableManualMode(isManualMode);
            loadWord();

            elements.wallGateRight.style.transform = 'translateX(0)';

            // 隐藏上一个爆出的胜利实物
            elements.victoryItem.className = "absolute bottom-6 z-30 text-8xl transition-all duration-700 transform scale-0 opacity-0 pointer-events-none flex flex-col items-center";

            // 清理已有的倒计时
            clearInterval(timerInterval);
            elements.timerBar.style.width = '100%';

            // 2. 延迟加载数据并开门 (等待滑门在650ms内完全关闭)
            setTimeout(() => {
                elements.targetPinyin.innerText = currentItem.pinyin;
                elements.targetEmoji.innerText = currentItem.emoji;
                elements.wordLen.innerText = currentItem.word.length;

                // 🌟 开启拼音和 Emoji 图片的呼吸闪烁状态
                elements.targetPinyin.classList.add('pinyin-blinking');
                elements.targetEmoji.classList.add('emoji-blinking');

                // 🌟 动态调整拼音的字体大小，进行舒适微调，确保不管拼音长短，100%保持在单行显示！
                const pinyinLength = currentItem.pinyin.length;
                if (pinyinLength > 11) {
                    elements.targetPinyin.style.fontSize = '1.6rem'; // 长词
                } else if (pinyinLength > 8) {
                    elements.targetPinyin.style.fontSize = '2.0rem'; // 中词
                } else {
                    elements.targetPinyin.style.fontSize = '2.5rem'; // 短词
                }

                // 播放石门滑开声效
                playSound('slide');

                // 左右滑门拉开（利用内联样式直接驱动，100% 成功开门！）
                elements.wallGateLeft.style.transform = 'translateX(-101%)';
                elements.wallGateRight.style.transform = 'translateX(101%)';

                // 开门动画完成后（约600ms），才启动学生的答题倒计时并解除过渡态
                setTimeout(() => {
                    if (isPlaying) {
                        resetWordTimer();
                        isTransitioning = false; // 解除状态锁，允许进行下一次发音与判定
                    }
                }, 600);

            }, 650); // 从原来的 400ms 调整为 650ms，以契合 0.6s 的滑门关闭物理过渡
        }

        // 重置倒计时（允许学生在同一题原地复活挑战）
        function resetWordTimer() {
            timeLeft = wordTimeLimit;
            updateTimerBar();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                updateTimerBar();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleWrongAnswer("时间到 😢！声调不要犹豫噢！⏳");
                }
            }, 100);
        }

        function updateTimerBar() {
            const percentage = (timeLeft / wordTimeLimit) * 100;
            elements.timerBar.style.width = `${percentage}%`;
            if (percentage < 30) {
                elements.timerBar.className = "absolute top-0 left-0 h-1.5 bg-rose-500 rounded-full transition-all duration-100 ease-linear";
            } else {
                elements.timerBar.className = "absolute top-0 left-0 h-1.5 bg-yellow-400 rounded-full transition-all duration-100 ease-linear";
            }
        }

        // 判定正确 (破门开箱成功，获得水果/动物并展示在下方蓝色垫子上)
        function handleCorrectAnswer() {
            if (isTransitioning) return; // 如果正在播放过渡动画，忽略此次触发
            isTransitioning = true; // 锁定状态，防止重复匹配或重复触发

            clearInterval(timerInterval);
            consecutiveSpeechErrors = 0; // 重置错误计数
            playSound('success');
            playSound('explosion');

            const currentItem = currentWords[currentWordIndex];

            // 🌟 读准后，立刻停止闪烁，锁定完全可见的不透明度 (直到新词再合拢)
            elements.targetPinyin.classList.remove('pinyin-blinking');
            elements.targetEmoji.classList.remove('emoji-blinking');
            elements.targetPinyin.style.opacity = '1.0';
            elements.targetEmoji.style.opacity = '0.3'; // 通关时的正常半透明状态

            // 下方蓝色赛道上直接爆出高保真和可爱的 Emoji 实物
            elements.victoryEmoji.innerText = currentItem.emoji;
            // 🌟 升级：爆出奖励时将拼音显示在下面，而不是汉字词汇！
            elements.victoryText.innerText = formatPinyinForDisplay(currentItem.pinyin);
            elements.victoryItem.className = "absolute bottom-12 z-30 text-8xl transform scale-125 opacity-100 pointer-events-none flex flex-col items-center transition-all duration-500 ease-out";

            score += 10;
            elements.score.innerText = score;

            // 鼓励飘字
            spawnFeedbackText(true);

            // 答对后 1.8 秒后载入下一个拼音卡
            setTimeout(() => {
                currentWordIndex++;
                loadWord();
            }, 1800);
        }

        // 判定错误 (扣分/扣心，不跳过当前题，橘黄色显示卡剧烈抖动)
        function handleWrongAnswer(customHintText = "") {
            if (isTransitioning) return; // 如果正在过渡中，直接忽略
            isTransitioning = true;

            clearInterval(timerInterval);
            playSound('error');

            // 拼音橘黄展示卡发生剧烈颤抖（完美的交互反馈）
            elements.orangeDisplayCard.classList.add('shake-error');
            setTimeout(() => {
                elements.orangeDisplayCard.classList.remove('shake-error');
            }, 400);

            lives = Math.max(0, lives - 1); // 扣心
            updateHeartsUI();

            // 增加连续发音超时或错误的判定计数
            consecutiveSpeechErrors++;

            // 🧱 每次读错，3D滑门石门都会重重合拢，然后再重新滑开，作为极具动感的反复物理惩罚
            elements.wallGateLeft.style.transform = 'translateX(0)';
            elements.wallGateRight.style.transform = 'translateX(0)';
            playSound('slide');

            // 触发趣味伤心弹幕 (闪烁继续进行，不被中断)
            spawnFeedbackText(false, customHintText);

            // 延时 1000ms（石门关紧1秒后，让学生能够清晰看到反馈提示并听到错误音效）再重新自动滑开，并重置倒计时
            setTimeout(() => {
                if (isPlaying) {
                    playSound('slide');
                    elements.wallGateLeft.style.transform = 'translateX(-101%)';
                    elements.wallGateRight.style.transform = 'translateX(101%)';

                    // 门完全重新拉开后再解除锁定并重设计时器
                    setTimeout(() => {
                        if (isPlaying) {
                            resetWordTimer();
                            isTransitioning = false; // 解除状态锁
                        }
                    }, 600);
                } else {
                    isTransitioning = false;
                }
            }, 1000);
        }

        // 更新生命值 UI
        function updateHeartsUI() {
            elements.heartsContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('i');
                heart.setAttribute('data-lucide', 'heart');
                if (i < lives) {
                    heart.className = 'text-rose-500 fill-rose-500 w-5 h-5';
                } else {
                    heart.className = 'text-slate-600 w-5 h-5';
                }
                elements.heartsContainer.appendChild(heart);
            }
            lucide.createIcons();
        }

        // 终极通关：大奖杯大拇指庆典，增添“返回主菜单 (Back to Menu)”专属交互
        function showGameWonScreen() {
            isPlaying = false;
            clearInterval(timerInterval);
            stopWebcam();

            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }

            // 隐藏底部的游戏设置选单，防止推开界面高度
            elements.gameSetup.classList.add('hidden');

            elements.overlayEmoji.innerText = "🏆";
            elements.overlayTitle.innerText = "祝贺你挑战成功！";
            elements.overlayDesc.innerHTML = `
                <div class="flex flex-col items-center space-y-4 py-2 font-sans">
                    <!-- 🏆🌟 精简视觉：卡片内部原有的🏆图标已经替换，现在内部卡片只保留一个大大的👍点赞动画，干净不重叠 -->
                    <span class="text-8xl animate-bounce">👍</span>
                    <p class="text-xl font-bold text-yellow-300 font-game">发音精准！所有拼音通关！</p>
                    <p class="text-sm text-slate-300 mb-2">完美获得：<strong class="text-yellow-400 text-lg">${score}</strong> 积分</p>
                    
                    <!-- 极其醒目、高优先级的卡片内专属“返回主菜单”交互按钮，排版规格与主按钮完全一致，杜绝换行 -->
                    <button id="btn-play-again-inner" class="w-full max-w-xs bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-500 hover:to-green-600 active:scale-95 text-slate-950 font-black text-xl py-4 rounded-2xl shadow-lg shadow-emerald-500/20 tracking-widest transition-all mb-4 border-b-4 border-green-700 flex items-center justify-center space-x-2 font-game pointer-events-auto">
                        <i data-lucide="home" class="w-6 h-6"></i>
                        <span>返回主菜单</span>
                    </button>
                </div>
            `;
            elements.btnStartText.innerText = "返回主菜单"; // 同时改变下方主按钮文本

            elements.overlayScreen.classList.remove('hidden');

            // 动态刷新图标
            lucide.createIcons();

            // 绑定全新增加的内部中心按钮点击事件，返回最开端
            const playAgainBtn = document.getElementById('btn-play-again-inner');
            if (playAgainBtn) {
                playAgainBtn.onclick = () => {
                    resetGameToMainScreen();
                };
            }
            // 主开始按钮点击在结算页中时同样也绑定为返回主屏
            elements.btnStart.onclick = () => {
                resetGameToMainScreen();
            };
        }

        // 摄像头
        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 480, height: 640, facingMode: 'user' }, 
                    audio: false 
                });
                
                // 🌟 顶部栏玩家实时头像画面
                if (elements.webcamAvatar) {
                    elements.webcamAvatar.srcObject = stream;
                    elements.webcamAvatar.classList.remove('hidden');
                }
                if (elements.avatarFallback) {
                    elements.avatarFallback.classList.add('opacity-0');
                }
            } catch (err) {
                console.warn("无法打开摄像头:", err);
                stopWebcam();
            }
        }

        // 关闭摄像头
        function stopWebcam() {
            // 🌟 停止顶部玩家头像画面并恢复占位符
            if (elements.webcamAvatar && elements.webcamAvatar.srcObject) {
                const tracks = elements.webcamAvatar.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                elements.webcamAvatar.srcObject = null;
            }
            if (elements.webcamAvatar) {
                elements.webcamAvatar.classList.add('hidden');
            }
            if (elements.avatarFallback) {
                elements.avatarFallback.classList.remove('opacity-0');
            }
        }
    </script>
</body>
</html>
