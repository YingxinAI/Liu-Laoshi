<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老外中文拼音大挑战 - Pinyin Challenge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
        .font-game {
            font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
        }
        /* 3D 赛道透视 */
        .road-container {
            perspective: 800px;
        }
        .road {
            transform: rotateX(60deg);
            transform-origin: bottom center;
            background: linear-gradient(to top, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
        }
        /* 砖墙碎裂动画 */
        @keyframes break-wall {
            0% { transform: scale(1) translateZ(0); opacity: 1; }
            50% { transform: scale(1.1) rotate(5deg) translateY(-20px); opacity: 0.8; }
            100% { transform: scale(0) rotate(-45deg) translateY(200px); opacity: 0; }
        }
        .wall-break {
            animation: break-wall 0.6s forwards ease-in-out;
        }
        /* 抖动动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake-error {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-2 sm:p-4 font-sans select-none overflow-hidden">

    <!-- 主容器：手机长宽比 -->
    <div class="relative w-full max-w-md h-[92vh] max-h-[850px] bg-slate-950 rounded-3xl border-4 border-slate-700 shadow-2xl flex flex-col overflow-hidden">
        
        <!-- 背景：摄像头画面 / 备用卡通背景 -->
        <div class="absolute inset-0 z-0">
            <!-- 摄像头轨道 -->
            <video id="webcam" class="w-full h-full object-cover scale-x-[-1] opacity-60 hidden" autoplay playsinline></video>
            <!-- 备用渐变背景 -->
            <div id="fallback-bg" class="w-full h-full bg-gradient-to-b from-indigo-950 via-purple-950 to-slate-950 flex flex-col justify-between p-6">
                <!-- 星空粒子效果 -->
                <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:16px_16px]"></div>
            </div>
        </div>

        <!-- 游戏层：覆盖在背景之上 -->
        <div class="relative z-10 flex flex-col h-full justify-between pointer-events-none">
            
            <!-- 顶部栏：得分、生命值、模式切换 -->
            <div class="p-4 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent pt-6 pointer-events-auto">
                <div class="flex items-center space-x-2 bg-black/40 px-3 py-1.5 rounded-full backdrop-blur-md">
                    <i data-lucide="trophy" class="text-amber-400 w-5 h-5"></i>
                    <span class="font-game text-xl tracking-wider">SCORE: <span id="score" class="text-yellow-300">0</span></span>
                </div>
                
                <!-- 生命值 -->
                <div class="flex space-x-1 bg-black/40 px-3 py-1.5 rounded-full backdrop-blur-md" id="hearts-container">
                    <i data-lucide="heart" class="text-rose-500 fill-rose-500 w-5 h-5"></i>
                    <i data-lucide="heart" class="text-rose-500 fill-rose-500 w-5 h-5"></i>
                    <i data-lucide="heart" class="text-rose-500 fill-rose-500 w-5 h-5"></i>
                </div>
            </div>

            <!-- 右上角：魔性卡米拉表情框 -->
            <div class="absolute top-20 right-4 w-28 h-28 bg-black/60 border-2 border-pink-500 rounded-2xl overflow-hidden shadow-lg flex flex-col items-center justify-center p-1 backdrop-blur-md pointer-events-auto">
                <div class="relative w-16 h-16 flex items-center justify-center">
                    <!-- 恶搞嘴巴与五官 (SVG) -->
                    <svg id="reaction-face" viewBox="0 0 100 100" class="w-full h-full transition-transform duration-100">
                        <!-- 脸底 -->
                        <circle cx="50" cy="50" r="45" fill="#fbcfe8" stroke="#ec4899" stroke-width="3"/>
                        <!-- 眼睛 -->
                        <ellipse cx="35" cy="40" rx="6" ry="8" fill="#1e1b4b" id="left-eye"/>
                        <ellipse cx="65" cy="40" rx="6" ry="8" fill="#1e1b4b" id="right-eye"/>
                        <!-- 眉毛 -->
                        <path d="M25,30 Q35,28 42,35" stroke="#ec4899" stroke-width="3" stroke-linecap="round" fill="none" id="left-brow"/>
                        <path d="M75,30 Q65,28 58,35" stroke="#ec4899" stroke-width="3" stroke-linecap="round" fill="none" id="right-brow"/>
                        <!-- 巨大的嘴巴 (动态变化) -->
                        <path d="M30,65 Q50,65 70,65" fill="#9d174d" stroke="#ec4899" stroke-width="2" id="mouth" class="transition-all duration-100"/>
                    </svg>
                </div>
                <div id="reaction-bubble" class="text-[10px] text-pink-300 font-semibold text-center mt-1 leading-tight h-8 flex items-center justify-center px-1">
                    准备好了吗？
                </div>
            </div>

            <!-- 中间：3D 赛道与拼音墙 -->
            <div class="flex-1 flex flex-col items-center justify-end relative h-full">
                <!-- 3D 道路 -->
                <div class="road-container absolute bottom-0 w-full h-1/2 flex justify-center overflow-hidden">
                    <div class="road w-[150%] h-[200px] border-t-8 border-yellow-400/50 flex flex-col justify-between p-4">
                        <!-- 车道线 -->
                        <div class="w-full h-full border-l-4 border-r-4 border-dashed border-white/30 flex justify-center">
                            <div class="w-1 h-full bg-white/20"></div>
                        </div>
                    </div>
                </div>

                <!-- 拼音墙体 -->
                <div id="pinyin-wall" class="absolute bottom-16 w-11/12 max-w-[340px] flex flex-col items-center transition-all duration-300 transform scale-100">
                    <!-- 墙上漂浮的拼音卡片 -->
                    <div class="bg-gradient-to-r from-amber-500 to-orange-600 border-4 border-white rounded-2xl shadow-2xl p-4 text-center w-full z-20 transform -rotate-1 relative">
                        <!-- 进度条 -->
                        <div class="absolute top-0 left-0 h-1.5 bg-yellow-400 rounded-full transition-all duration-100 ease-linear" id="timer-bar" style="width: 100%;"></div>
                        
                        <div class="text-sm font-semibold tracking-widest text-yellow-100 uppercase mt-2">请读出拼音</div>
                        <div id="target-pinyin" class="text-4xl font-black text-white py-3 tracking-wide drop-shadow-[0_2px_4px_rgba(0,0,0,0.6)] font-game">tǔ dòu</div>
                        <div class="flex justify-center space-x-2 text-xs text-amber-100 bg-amber-950/40 py-1 px-3 rounded-full w-fit mx-auto">
                            <span>字数: <strong id="word-len">2</strong></span>
                            <span>•</span>
                            <span>提示：说出对应的中文</span>
                        </div>
                    </div>
                    
                    <!-- 砖墙底座 (利用CSS画出砖块堆叠效果) -->
                    <div class="w-full bg-orange-800 border-x-4 border-b-4 border-orange-950 h-16 rounded-b-2xl shadow-md grid grid-cols-4 gap-0.5 p-1 -mt-1 z-10">
                        <div class="bg-orange-700 rounded-sm border border-orange-900"></div>
                        <div class="bg-orange-600 rounded-sm border border-orange-900"></div>
                        <div class="bg-orange-700 rounded-sm border border-orange-900"></div>
                        <div class="bg-orange-600 rounded-sm border border-orange-900"></div>
                    </div>
                </div>

                <!-- 爆炸特效爆出物 -->
                <div id="victory-item" class="absolute bottom-28 z-30 text-8xl transition-all duration-700 transform scale-0 opacity-0 pointer-events-none flex flex-col items-center">
                    <span id="victory-emoji">🥔</span>
                    <span id="victory-text" class="text-3xl font-black bg-black/80 px-4 py-1 rounded-full text-yellow-300 mt-2 border border-yellow-400 font-game">土豆</span>
                </div>
            </div>

            <!-- 底部栏：控制台、麦克风指示、手动操作 -->
            <div class="p-4 bg-gradient-to-t from-black/90 via-black/70 to-transparent space-y-3 pb-8 pointer-events-auto">
                
                <!-- 状态提示 -->
                <div class="flex items-center justify-center space-x-2 text-sm text-center py-1">
                    <span class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500" id="status-dot"></span>
                    </span>
                    <span class="text-emerald-300 font-medium" id="status-text">麦克风已就绪，等待读音...</span>
                </div>

                <!-- 教师/手动操作键盘 (备用及课堂互动) -->
                <div class="flex justify-between items-center gap-2">
                    <!-- 左：手动判断错 -->
                    <button id="btn-wrong" class="flex-1 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white py-3 rounded-2xl flex items-center justify-center space-x-1 font-bold shadow-lg transition-all border-b-4 border-rose-800">
                        <i data-lucide="x-circle"></i>
                        <span>判定错 (Esc)</span>
                    </button>
                    <!-- 中：语音/手动模式切换 -->
                    <button id="btn-mode-toggle" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-2xl flex items-center justify-center shadow-lg transition-all" title="切换模式">
                        <i data-lucide="mic" id="mode-icon"></i>
                    </button>
                    <!-- 右：手动判断对 -->
                    <button id="btn-correct" class="flex-[1.5] bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white py-3 rounded-2xl flex items-center justify-center space-x-1 font-bold shadow-lg transition-all border-b-4 border-emerald-700">
                        <i data-lucide="check-circle"></i>
                        <span>判定对 (Space)</span>
                    </button>
                </div>

                <div class="text-[10px] text-center text-slate-400">
                    语音识别仅支持 Chrome/Edge 浏览器。支持教师手动裁判模式。
                </div>
            </div>
        </div>

        <!-- 遮罩层：游戏未开始 / 游戏结束 -->
        <div id="overlay-screen" class="absolute inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-between p-6 text-center">
            
            <!-- 顶部装饰 -->
            <div class="mt-8">
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-orange-400 to-red-500 tracking-wider font-game drop-shadow-md">
                    拼音大挑战
                </h1>
                <p class="text-sm text-slate-400 mt-2 uppercase tracking-widest">Pinyin Challenge Game</p>
            </div>

            <!-- 主内容区 -->
            <div id="overlay-content" class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
                <div class="text-5xl" id="overlay-emoji">🎮</div>
                <h2 class="text-2xl font-bold text-white font-game" id="overlay-title">挑战开始！</h2>
                <p class="text-sm text-slate-300 leading-relaxed" id="overlay-desc">
                    请大声读出屏幕上的拼音。如果发音正确，大墙就会被击碎！
                </p>

                <!-- 游戏配置 -->
                <div class="space-y-3 pt-2 text-left" id="game-setup">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">选择词库类型</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="cat-btn py-2.5 px-3 rounded-xl border-2 border-yellow-500 bg-yellow-500/10 text-yellow-300 text-sm font-semibold transition-all flex items-center justify-center space-x-1" data-cat="veggies">
                            <span>🥔 蔬菜水果</span>
                        </button>
                        <button class="cat-btn py-2.5 px-3 rounded-xl border-2 border-slate-700 hover:border-slate-500 bg-slate-800/50 text-slate-300 text-sm font-semibold transition-all flex items-center justify-center space-x-1" data-cat="animals">
                            <span>🦁 趣味动物</span>
                        </button>
                    </div>
                    
                    <div class="flex items-center space-x-2 pt-2">
                        <input type="checkbox" id="use-camera" class="w-4 h-4 rounded text-blue-600 bg-slate-800 border-slate-700 focus:ring-blue-500" checked>
                        <label for="use-camera" class="text-xs text-slate-300 cursor-pointer">开启摄像头（模拟AR滤镜效果）</label>
                    </div>
                </div>
            </div>

            <!-- 开始/重来按钮 -->
            <button id="btn-start" class="w-full max-w-xs bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-500 hover:to-amber-600 active:scale-95 text-slate-950 font-black text-xl py-4 rounded-2xl shadow-lg shadow-yellow-500/20 tracking-widest transition-all mb-8 border-b-4 border-amber-700 flex items-center justify-center space-x-2 font-game">
                <i data-lucide="play-circle" class="w-6 h-6 fill-current"></i>
                <span id="btn-start-text">开始挑战</span>
            </button>
        </div>

    </div>

    <!-- 脚本逻辑 -->
    <script>
        // 游戏词库数据
        const wordBanks = {
            veggies: [
                { word: '土豆', pinyin: 'tǔ dòu', emoji: '🥔' },
                { word: '西兰花', pinyin: 'xī lán huā', emoji: '🥦' },
                { word: '西红柿', pinyin: 'xī hóng shì', emoji: '🍅' },
                { word: '西瓜', pinyin: 'xī guā', emoji: '🍉' },
                { word: '香蕉', pinyin: 'xiāng jiāo', emoji: '🍌' },
                { word: '胡萝卜', pinyin: 'hú luó bo', emoji: '🥕' },
                { word: '玉米', pinyin: 'yù mǐ', emoji: '🌽' },
                { word: '草莓', pinyin: 'cǎo méi', emoji: '🍓' },
                { word: '菠萝', pinyin: 'bō luó', emoji: '🍍' },
                { word: '南瓜', pinyin: 'nán guā', emoji: '🎃' }
            ],
            animals: [
                { word: '老虎', pinyin: 'lǎo hǔ', emoji: '🐯' },
                { word: '熊猫', pinyin: 'xióng māo', emoji: '🐼' },
                { word: '长颈鹿', pinyin: 'cháng jǐng lù', emoji: '🦒' },
                { word: '兔子', pinyin: 'tù zi', emoji: '🐰' },
                { word: '青蛙', pinyin: 'qīng wā', emoji: '🐸' },
                { word: '企鹅', pinyin: 'qǐ é', emoji: '🐧' },
                { word: '松鼠', pinyin: 'sōng shǔ', emoji: '🐿️' },
                { word: '大象', pinyin: 'dà xiàng', emoji: '🐘' },
                { word: '狮子', pinyin: 'shī zi', emoji: '🦁' },
                { word: '恐龙', pinyin: 'kǒng lóng', emoji: '🦖' }
            ]
        };

        // 状态管理
        let score = 0;
        let lives = 3;
        let currentWordIndex = 0;
        let activeBank = 'veggies';
        let currentWords = [];
        let isPlaying = false;
        let isListening = false;
        let isManualMode = false; // 手动模式（课堂演示模式）
        let timerInterval = null;
        let wordTimeLimit = 15; // 15秒一题
        let timeLeft = 15;

        // 音频上下文（纯代码生成音效，不依赖外部mp3）
        let audioCtx = null;

        // 语音识别组件 (Web Speech API)
        let recognition = null;

        // DOM 元素引用
        const elements = {
            score: document.getElementById('score'),
            heartsContainer: document.getElementById('hearts-container'),
            targetPinyin: document.getElementById('target-pinyin'),
            wordLen: document.getElementById('word-len'),
            timerBar: document.getElementById('timer-bar'),
            pinyinWall: document.getElementById('pinyin-wall'),
            victoryItem: document.getElementById('victory-item'),
            victoryEmoji: document.getElementById('victory-emoji'),
            victoryText: document.getElementById('victory-text'),
            statusText: document.getElementById('status-text'),
            statusDot: document.getElementById('status-dot'),
            btnWrong: document.getElementById('btn-wrong'),
            btnCorrect: document.getElementById('btn-correct'),
            btnModeToggle: document.getElementById('btn-mode-toggle'),
            modeIcon: document.getElementById('mode-icon'),
            overlayScreen: document.getElementById('overlay-screen'),
            overlayEmoji: document.getElementById('overlay-emoji'),
            overlayTitle: document.getElementById('overlay-title'),
            overlayDesc: document.getElementById('overlay-desc'),
            btnStart: document.getElementById('btn-start'),
            btnStartText: document.getElementById('btn-start-text'),
            useCamera: document.getElementById('use-camera'),
            webcam: document.getElementById('webcam'),
            fallbackBg: document.getElementById('fallback-bg'),
            gameSetup: document.getElementById('game-setup'),
            reactionFace: document.getElementById('reaction-face'),
            reactionBubble: document.getElementById('reaction-bubble')
        };

        // 卡米拉人脸动态控制
        const faceParts = {
            mouth: document.getElementById('mouth'),
            leftEye: document.getElementById('left-eye'),
            rightEye: document.getElementById('right-eye'),
            leftBrow: document.getElementById('left-brow'),
            rightBrow: document.getElementById('right-brow'),
            face: document.getElementById('reaction-face')
        };

        // 初始化
        window.onload = () => {
            lucide.createIcons();
            initAudio();
            initSpeechRecognition();
            setupEventListeners();
        };

        // 声音播放
        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.warn('AudioContext not supported');
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            // 处理 iOS 声音锁定
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'success') {
                // 叮咚声
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'error') {
                // 警报声
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'explosion') {
                // 爆炸白噪音
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.5);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'fanfare') {
                // 游戏胜利欢呼
                osc.type = 'triangle';
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const oscNote = audioCtx.createOscillator();
                    const gainNote = audioCtx.createGain();
                    oscNote.connect(gainNote);
                    gainNote.connect(audioCtx.destination);
                    oscNote.type = 'sine';
                    oscNote.frequency.setValueAtTime(freq, now + idx * 0.1);
                    gainNote.gain.setValueAtTime(0.2, now + idx * 0.1);
                    gainNote.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
                    oscNote.start(now + idx * 0.1);
                    oscNote.stop(now + idx * 0.1 + 0.3);
                });
            }
        }

        // 初始化语音识别
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.warn('Speech Recognition not supported in this browser.');
                updateStatus('语音识别在此浏览器不可用，已自动开启手动演示模式', 'warn');
                enableManualMode(true);
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'zh-CN';

            recognition.onstart = () => {
                isListening = true;
                if (!isManualMode) {
                    updateStatus('正在倾听发音中...大声说出来吧！', 'success');
                    animateFace('listening');
                }
            };

            recognition.onerror = (e) => {
                console.error('Speech recognition error:', e.error);
                if (e.error === 'not-allowed') {
                    updateStatus('未获取麦克风权限，请点击允许或换用手动模式', 'warn');
                }
            };

            recognition.onend = () => {
                isListening = false;
                // 如果游戏正在进行，并且没有被切回手动模式，则重新启动监听
                if (isPlaying && !isManualMode) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error(e);
                    }
                }
            };

            recognition.onresult = (event) => {
                if (!isPlaying || isManualMode) return;

                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                // 实时嘴型变化模拟：听到音量/字数时张嘴
                if (interimTranscript.length > 0 || finalTranscript.length > 0) {
                    animateFace('speaking');
                    const text = finalTranscript || interimTranscript;
                    updateStatus(`听到了: "${text}"`, 'success');
                    
                    // 校验是否读对
                    checkSpeechAnswer(text);
                }
            };
        }

        // 检测语音答案是否包含目标汉字
        function checkSpeechAnswer(speechText) {
            const currentItem = currentWords[currentWordIndex];
            if (!currentItem) return;

            // 清理无用标点
            const cleanText = speechText.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。！，]/g, "");
            
            // 模糊匹配：如果识别出的文本中包含了当前的汉字（如“土豆”），即通关
            if (cleanText.includes(currentItem.word)) {
                handleCorrectAnswer();
            }
        }

        // 事件监听
        function setupEventListeners() {
            // 开始按钮
            elements.btnStart.onclick = () => {
                initAudio(); // 解决用户交互解锁音频问题
                startGame();
            };

            // 手动判断正确 (空格键)
            elements.btnCorrect.onclick = () => {
                if (isPlaying) handleCorrectAnswer();
            };

            // 手动判断错误 (ESC键)
            elements.btnWrong.onclick = () => {
                if (isPlaying) handleWrongAnswer();
            };

            // 模式切换按钮
            elements.btnModeToggle.onclick = () => {
                enableManualMode(!isManualMode);
            };

            // 词库类别切换
            const catButtons = document.querySelectorAll('.cat-btn');
            catButtons.forEach(btn => {
                btn.onclick = () => {
                    catButtons.forEach(b => {
                        b.classList.remove('border-yellow-500', 'bg-yellow-500/10', 'text-yellow-300');
                        b.classList.add('border-slate-700', 'bg-slate-800/50', 'text-slate-300');
                    });
                    btn.classList.add('border-yellow-500', 'bg-yellow-500/10', 'text-yellow-300');
                    btn.classList.remove('border-slate-700', 'bg-slate-800/50', 'text-slate-300');
                    activeBank = btn.dataset.cat;
                };
            });

            // 键盘事件支持（太适合教室里投影了，老师拿着键盘就可以判定）
            document.addEventListener('keydown', (e) => {
                if (!isPlaying) return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    handleCorrectAnswer();
                } else if (e.code === 'Escape') {
                    e.preventDefault();
                    handleWrongAnswer();
                }
            });
        }

        // 切换模式功能（手动/语音）
        function enableManualMode(enable) {
            isManualMode = enable;
            if (isManualMode) {
                elements.modeIcon.setAttribute('data-lucide', 'keyboard');
                elements.btnModeToggle.classList.add('bg-emerald-600/30', 'text-emerald-300', 'border', 'border-emerald-500/50');
                updateStatus('已进入教师手动裁判模式（空格对，Esc错）', 'normal');
                if (recognition) {
                    try { recognition.stop(); } catch(e){}
                }
            } else {
                elements.modeIcon.setAttribute('data-lucide', 'mic');
                elements.btnModeToggle.classList.remove('bg-emerald-600/30', 'text-emerald-300', 'border', 'border-emerald-500/50');
                updateStatus('正在尝试启动语音识别...', 'normal');
                startVoiceListening();
            }
            lucide.createIcons();
        }

        // 开启语音监听
        function startVoiceListening() {
            if (recognition && !isListening && isPlaying && !isManualMode) {
                try {
                    recognition.start();
                } catch (e) {
                    console.error(e);
                }
            }
        }

        // 更新状态指示
        function updateStatus(text, type = 'normal') {
            elements.statusText.innerText = text;
            elements.statusDot.className = "relative inline-flex rounded-full h-3 w-3 ";
            if (type === 'success') {
                elements.statusDot.classList.add('bg-emerald-500');
                elements.statusText.className = 'text-emerald-300 font-medium';
            } else if (type === 'warn') {
                elements.statusDot.classList.add('bg-rose-500');
                elements.statusText.className = 'text-rose-400 font-medium';
            } else {
                elements.statusDot.classList.add('bg-blue-500');
                elements.statusText.className = 'text-blue-300 font-medium';
            }
        }

        // 开始游戏
        function startGame() {
            score = 0;
            lives = 3;
            currentWordIndex = 0;
            isPlaying = true;
            elements.score.innerText = score;
            updateHeartsUI();

            // 乱序排列词库
            currentWords = [...wordBanks[activeBank]].sort(() => Math.random() - 0.5);

            // 隐藏遮罩
            elements.overlayScreen.classList.add('hidden');

            // 开启摄像头 (如果勾选)
            if (elements.useCamera.checked) {
                startWebcam();
            } else {
                stopWebcam();
            }

            // 加载第一个词
            loadWord();

            // 开启语音监听
            if (!isManualMode) {
                startVoiceListening();
            }
        }

        // 加载词语
        function loadWord() {
            if (currentWordIndex >= currentWords.length) {
                // 如果玩通了所有词，就重新打乱
                currentWords = [...wordBanks[activeBank]].sort(() => Math.random() - 0.5);
                currentWordIndex = 0;
            }

            const currentItem = currentWords[currentWordIndex];
            elements.targetPinyin.innerText = currentItem.pinyin;
            elements.wordLen.innerText = currentItem.word.length;

            // 还原墙体状态与大小
            elements.pinyinWall.className = "absolute bottom-16 w-11/12 max-w-[340px] flex flex-col items-center transition-all duration-300 transform scale-100";
            elements.victoryItem.className = "absolute bottom-28 z-30 text-8xl transition-all duration-700 transform scale-0 opacity-0 pointer-events-none flex flex-col items-center";

            // 开启倒计时
            timeLeft = wordTimeLimit;
            updateTimerBar();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                updateTimerBar();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleWrongAnswer(); // 超时算错
                }
            }, 100);

            animateFace('normal');
        }

        // 更新时间条
        function updateTimerBar() {
            const percentage = (timeLeft / wordTimeLimit) * 100;
            elements.timerBar.style.width = `${percentage}%`;
            if (percentage < 30) {
                elements.timerBar.className = "absolute top-0 left-0 h-1.5 bg-rose-500 rounded-full transition-all duration-100 ease-linear";
                animateFace('panic');
            } else {
                elements.timerBar.className = "absolute top-0 left-0 h-1.5 bg-yellow-400 rounded-full transition-all duration-100 ease-linear";
            }
        }

        // 判定正确 (破墙通关)
        function handleCorrectAnswer() {
            clearInterval(timerInterval);
            playSound('success');
            playSound('explosion');

            const currentItem = currentWords[currentWordIndex];

            // 爆出物动画
            elements.victoryEmoji.innerText = currentItem.emoji;
            elements.victoryText.innerText = currentItem.word;
            elements.victoryItem.className = "absolute bottom-36 z-30 text-9xl transform scale-125 opacity-100 pointer-events-none flex flex-col items-center transition-all duration-500 ease-out";

            // 墙裂开消失
            elements.pinyinWall.classList.add('wall-break');

            score += 10;
            elements.score.innerText = score;

            animateFace('happy');

            // 延迟后加载下一个
            setTimeout(() => {
                currentWordIndex++;
                loadWord();
            }, 1500);
        }

        // 判定错误 (撞墙或超时)
        function handleWrongAnswer() {
            clearInterval(timerInterval);
            playSound('error');

            // 墙壁抖动
            elements.pinyinWall.classList.add('shake-error');
            setTimeout(() => {
                elements.pinyinWall.classList.remove('shake-error');
            }, 400);

            lives--;
            updateHeartsUI();
            animateFace('angry');

            if (lives <= 0) {
                gameOver(false);
            } else {
                // 延迟后自动跳到下一个词
                setTimeout(() => {
                    currentWordIndex++;
                    loadWord();
                }, 1500);
            }
        }

        // 更新生命值 UI
        function updateHeartsUI() {
            elements.heartsContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('i');
                heart.setAttribute('data-lucide', 'heart');
                if (i < lives) {
                    heart.className = 'text-rose-500 fill-rose-500 w-5 h-5';
                } else {
                    heart.className = 'text-slate-600 w-5 h-5';
                }
                elements.heartsContainer.appendChild(heart);
            }
            lucide.createIcons();
        }

        // 游戏结束
        function gameOver(win = false) {
            isPlaying = false;
            clearInterval(timerInterval);
            stopWebcam();

            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }

            // 修改遮罩文案
            elements.overlayEmoji.innerText = "😭";
            elements.overlayTitle.innerText = "游戏结束 - 挑战失败";
            elements.overlayDesc.innerHTML = `你总共击碎了 <strong class="text-yellow-400">${score / 10}</strong> 面拼音墙，获得了 <strong class="text-yellow-400">${score}</strong> 分！<br>卡米拉大吼：<i>"I hate this one!"</i>`;
            elements.btnStartText.innerText = "重新挑战";

            animateFace('dead');

            // 显示遮罩
            elements.overlayScreen.classList.remove('hidden');
        }

        // 摄像头调用
        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 480, height: 640, facingMode: 'user' }, 
                    audio: false 
                });
                elements.webcam.srcObject = stream;
                elements.webcam.classList.remove('hidden');
                elements.fallbackBg.classList.add('opacity-40'); // 让原背景变暗，提升对比度
            } catch (err) {
                console.warn("无法打开摄像头:", err);
                stopWebcam();
            }
        }

        function stopWebcam() {
            if (elements.webcam.srcObject) {
                const tracks = elements.webcam.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                elements.webcam.srcObject = null;
            }
            elements.webcam.classList.add('hidden');
            elements.fallbackBg.classList.remove('opacity-40');
        }

        // 卡米拉恶搞人脸表情控制
        function animateFace(state) {
            const mouth = faceParts.mouth;
            const face = faceParts.face;
            
            // 还原所有变形
            face.style.transform = "scale(1)";
            faceParts.leftBrow.setAttribute('d', 'M25,30 Q35,28 42,35');
            faceParts.rightBrow.setAttribute('d', 'M75,30 Q65,28 58,35');

            switch (state) {
                case 'normal':
                    mouth.setAttribute('d', 'M35,62 Q50,62 65,62'); // 闭嘴
                    elements.reactionBubble.innerText = "加油！加油！";
                    elements.reactionBubble.className = "text-[10px] text-pink-300 font-semibold text-center mt-1 h-8 flex items-center justify-center";
                    break;
                case 'listening':
                    mouth.setAttribute('d', 'M40,62 Q50,65 60,62'); // 微微张嘴
                    elements.reactionBubble.innerText = "倾听中👂...";
                    break;
                case 'speaking':
                    // 嘴巴疯狂张大（视频同款）
                    mouth.setAttribute('d', 'M25,58 Q50,85 75,58 Q50,45 25,58'); 
                    face.style.transform = "scale(1.1)";
                    elements.reactionBubble.innerText = "大声点！";
                    break;
                case 'happy':
                    mouth.setAttribute('d', 'M30,55 Q50,75 70,55'); // 大笑
                    faceParts.leftBrow.setAttribute('d', 'M25,28 Q35,23 42,28');
                    faceParts.rightBrow.setAttribute('d', 'M75,28 Q65,23 58,28');
                    elements.reactionBubble.innerText = "好标准！🎉";
                    elements.reactionBubble.className = "text-[12px] text-emerald-400 font-bold text-center mt-1 h-8 flex items-center justify-center";
                    break;
                case 'panic':
                    mouth.setAttribute('d', 'M40,60 Q50,75 60,60 Q50,55 40,60'); // O型嘴
                    faceParts.leftBrow.setAttribute('d', 'M25,35 Q35,32 42,28');
                    faceParts.rightBrow.setAttribute('d', 'M75,35 Q65,32 58,28');
                    elements.reactionBubble.innerText = "时间不够啦！💥";
                    elements.reactionBubble.className = "text-[10px] text-red-400 font-bold text-center mt-1 h-8 flex items-center justify-center animate-pulse";
                    break;
                case 'angry':
                    mouth.setAttribute('d', 'M35,68 Q50,55 65,68'); // 撇嘴
                    faceParts.leftBrow.setAttribute('d', 'M25,35 Q35,33 42,42'); // 皱眉
                    faceParts.rightBrow.setAttribute('d', 'M75,35 Q65,33 58,42');
                    face.style.transform = "scale(1.1)";
                    elements.reactionBubble.innerText = "这读得啥呀！🤦‍♂️";
                    elements.reactionBubble.className = "text-[11px] text-orange-400 font-bold text-center mt-1 h-8 flex items-center justify-center";
                    break;
                case 'dead':
                    mouth.setAttribute('d', 'M35,68 Q50,55 65,68'); // 撇嘴
                    faceParts.leftBrow.setAttribute('d', 'M25,38 Q35,35 42,44');
                    faceParts.rightBrow.setAttribute('d', 'M75,38 Q65,35 58,44');
                    elements.reactionBubble.innerText = "I hate this one! 😡";
                    elements.reactionBubble.className = "text-[12px] text-rose-500 font-black text-center mt-1 h-8 flex items-center justify-center";
                    break;
            }
        }
    </script>
</body>
</html>
