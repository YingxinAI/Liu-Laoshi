<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文拼音大挑战 - Pinyin Challenge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
        .font-game {
            font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
        }
        /* 3D 赛道透气 */
        .road-container {
            perspective: 800px;
        }
        .road {
            transform: rotateX(72deg); /* 更加扁平的旋转角度，将蓝色垫子下拉 */
            transform-origin: bottom center;
            background: linear-gradient(to top, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
        }
        /* 抖动动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(-1deg); }
            20%, 60% { transform: translateX(-10px) rotate(-3deg); }
            40%, 80% { transform: translateX(10px) rotate(1deg); }
        }
        .shake-error {
            animation: shake 0.4s ease-in-out;
        }
        /* 弹幕浮动动画 */
        @keyframes float-up {
            0% { transform: translateY(20px) scale(0.8); opacity: 0; }
            20% { transform: translateY(0px) scale(1.1); opacity: 1; }
            80% { transform: translateY(-10px) scale(1); opacity: 1; }
            100% { transform: translateY(-30px) scale(0.9); opacity: 0; }
        }
        .feedback-pop {
            animation: float-up 1.5s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 🧱 拼音展示区左右滑开门过渡效果 */
        #wall-gate-left {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #wall-gate-right {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-2 sm:p-4 font-sans select-none overflow-hidden">

    <!-- 主容器：手机长宽比 -->
    <div class="relative w-full max-w-md h-[92vh] max-h-[850px] bg-slate-950 rounded-3xl border-4 border-slate-700 shadow-2xl flex flex-col overflow-hidden">
        
        <!-- 背景：摄像头画面 / 备用渐变背景 -->
        <div class="absolute inset-0 z-0">
            <!-- 摄像头轨道 -->
            <video id="webcam" class="w-full h-full object-cover scale-x-[-1] opacity-60 hidden" autoplay playsinline></video>
            <!-- 备用渐变背景 -->
            <div id="fallback-bg" class="w-full h-full bg-gradient-to-b from-indigo-950 via-purple-950 to-slate-950 flex flex-col justify-between p-6">
                <!-- 星空粒子效果 -->
                <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:16px_16px]"></div>
            </div>
        </div>

        <!-- 游戏层：采用纯 Flex 垂直流式布局，自适应间距，杜绝重叠 -->
        <div class="relative z-10 flex flex-col h-full justify-between p-3 sm:p-4 pointer-events-none">
            
            <!-- 1. 顶部栏：整合得分、魔性卡米拉、生命值 -->
            <div class="p-3 bg-black/60 rounded-2xl border border-slate-800 backdrop-blur-md pointer-events-auto flex justify-between items-center w-full z-30">
                <!-- 左：得分 -->
                <div class="flex items-center space-x-2">
                    <div class="flex items-center space-x-1 bg-black/30 px-2 py-1 rounded-xl border border-slate-700/20">
                        <i data-lucide="trophy" class="text-amber-400 w-4 h-4"></i>
                        <span class="font-game text-xs tracking-wider">得分: <span id="score" class="text-yellow-300">0</span></span>
                    </div>
                    <!-- 随时重来按钮 -->
                    <button id="btn-restart-mid" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 p-1.5 rounded-xl border border-slate-700/50 transition-all flex items-center justify-center" title="重新开始">
                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 text-cyan-400"></i>
                    </button>
                </div>
                
                <!-- 中：魔性卡米拉反应小窗口 -->
                <div class="flex flex-col items-center bg-slate-900/90 border border-pink-500/50 px-2 py-0.5 rounded-xl w-20 shadow-inner">
                    <svg id="reaction-face" viewBox="0 0 100 100" class="w-8 h-8 transition-transform duration-100">
                        <!-- 脸底 -->
                        <circle cx="50" cy="50" r="45" fill="#fbcfe8" stroke="#ec4899" stroke-width="2.5"/>
                        <!-- 眼睛 -->
                        <ellipse cx="35" cy="40" rx="6" ry="8" fill="#1e1b4b" id="left-eye"/>
                        <ellipse cx="65" cy="40" rx="6" ry="8" fill="#1e1b4b" id="right-eye"/>
                        <!-- 眉毛 -->
                        <path d="M25,30 Q35,28 42,35" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" fill="none" id="left-brow"/>
                        <path d="M75,30 Q65,28 58,35" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" fill="none" id="right-brow"/>
                        <!-- 巨大的嘴巴 -->
                        <path d="M30,65 Q50,65 70,65" fill="#9d174d" stroke="#ec4899" stroke-width="2" id="mouth" class="transition-all duration-100"/>
                    </svg>
                    <div id="reaction-bubble" class="text-[8px] text-pink-300 font-bold text-center leading-none mt-1 h-3 flex items-center justify-center truncate w-full">
                        准备好了吗？
                    </div>
                </div>

                <!-- 右：生命值 -->
                <div class="flex space-x-0.5 bg-black/30 px-2 py-1 rounded-xl border border-slate-700/20" id="hearts-container">
                    <i data-lucide="heart" class="text-rose-500 fill-rose-500 w-4 h-4"></i>
                    <i data-lucide="heart" class="text-rose-500 fill-rose-500 w-4 h-4"></i>
                    <i data-lucide="heart" class="text-rose-500 fill-rose-500 w-4 h-4"></i>
                </div>
            </div>

            <!-- 2. 中间主区域：使用自然流自适应布局，拒绝绝对位置重叠 -->
            <div class="flex-1 flex flex-col items-center justify-between py-2.5 relative w-full overflow-hidden">
                <!-- 趣味浮动文字反馈 -->
                <div id="text-feedback-container" class="absolute top-2 w-full flex flex-col items-center pointer-events-none z-40"></div>

                <!-- 【上部展示群组】：自上而下自适应排列 -->
                <div class="w-full flex flex-col items-center space-y-2.5 px-4 pointer-events-auto z-20">
                    
                    <!-- 橘黄色显示区 -->
                    <div id="orange-display-card" class="w-full max-w-[340px] bg-gradient-to-r from-amber-500 to-orange-600 border-4 border-white rounded-2xl shadow-2xl p-3 text-center transform -rotate-1 relative transition-all duration-300">
                        <!-- 进度条 -->
                        <div class="absolute top-0 left-0 h-1.5 bg-yellow-400 rounded-full transition-all duration-100 ease-linear" id="timer-bar" style="width: 100%;"></div>
                        
                        <div class="text-[9px] font-semibold tracking-widest text-yellow-100 uppercase mt-1">请大声读出</div>
                        
                        <!-- 拼音置于图片之上布局且具有“左右拉门式隔离墙门” -->
                        <div class="relative flex items-center justify-center h-24 my-1 overflow-hidden rounded-xl border border-amber-700/30 bg-amber-950/20">
                            <!-- 对应物品大图片/Emoji (半透明背景) -->
                            <div id="target-emoji" class="text-7xl select-none opacity-30 transition-all duration-300 transform scale-100">🥔</div>
                            <!-- 对应的拼音文本（覆盖在Emoji上方，强阴影） -->
                            <div id="target-pinyin" class="absolute text-3xl font-black text-white tracking-widest drop-shadow-[0_4px_6px_rgba(0,0,0,0.95)] font-game z-10 transition-all duration-300">tǔ dòu</div>

                            <!-- 🧱 左右拉门式堵门墙 (左侧门) —— 完美硬件加速动画，开局完全遮挡 -->
                            <div id="wall-gate-left" class="absolute top-0 left-0 w-1/2 h-full bg-gradient-to-r from-orange-700 to-orange-850 border-r-2 border-orange-950 z-20 grid grid-rows-3 grid-cols-2 gap-0.5 p-1">
                                <div class="bg-orange-600 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-750 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-750 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-600 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-600 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-750 rounded-sm border border-orange-900/40"></div>
                            </div>

                            <!-- 🧱 左右拉门式堵门墙 (右侧门) —— 完美硬件加速动画，开局完全遮挡 -->
                            <div id="wall-gate-right" class="absolute top-0 right-0 w-1/2 h-full bg-gradient-to-l from-orange-700 to-orange-850 border-l-2 border-orange-950 z-20 grid grid-rows-3 grid-cols-2 gap-0.5 p-1">
                                <div class="bg-orange-750 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-600 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-600 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-750 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-750 rounded-sm border border-orange-900/40"></div>
                                <div class="bg-orange-600 rounded-sm border border-orange-900/40"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 提示部分：置于卡片正下方 -->
                    <div id="mat-hints" class="flex justify-center space-x-2 text-[10px] text-blue-100 bg-blue-950/85 py-1 px-3 rounded-full border border-blue-400/30 backdrop-blur-md">
                        <span>字数: <strong id="word-len" class="text-yellow-300 font-bold">2</strong></span>
                        <span>•</span>
                        <span class="text-cyan-200 font-medium">提示：读准声调与发音</span>
                    </div>

                    <!-- 实时发音听写气泡 (彻底修复：h-auto 自适应配合 py-4 解决显示一半的问题) -->
                    <div class="w-full max-w-[320px] bg-black/90 border border-slate-800 rounded-xl px-4 py-4 backdrop-blur-lg flex flex-col items-center space-y-2 shadow-2xl h-auto justify-center transition-all duration-300 pointer-events-auto" id="speech-preview-box">
                        <span class="text-[9px] uppercase tracking-wider text-slate-400 font-bold flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            AI 实时发音听写器
                        </span>
                        <!-- 移除了书名号和引号，且行高优化为 leading-normal 彻底杜绝文字截断 -->
                        <div class="text-lg font-black text-center tracking-wide text-slate-300 leading-normal break-all" id="speech-transcript">
                            等待发音...
                        </div>
                        <div class="text-[10px] text-rose-400 font-semibold text-center hidden leading-tight" id="speech-error-hint">
                            ⚠️ 声调好像不对哦，请重新尝试！
                        </div>
                    </div>

                </div>

                <!-- 【下部赛道群组】：蓝色垫子移至最底部，不设置静态重叠砖墙 -->
                <div class="relative w-full h-24 flex items-center justify-center mt-auto pointer-events-auto">
                    <!-- 3D 道路 (蓝色垫子) -->
                    <div class="road-container absolute inset-0 w-full h-full flex justify-center overflow-hidden pointer-events-none">
                        <div class="road w-[150%] h-[80px] border-t-4 border-yellow-400/50 flex flex-col justify-between p-2">
                            <!-- 车道线 -->
                            <div class="w-full h-full border-l-4 border-r-4 border-dashed border-white/30 flex justify-center">
                                <div class="w-1 h-full bg-white/20"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 爆炸特效爆出物 (答对时直接在蓝色跑道上爆出来) -->
                    <div id="victory-item" class="absolute bottom-6 z-30 text-8xl transition-all duration-700 transform scale-0 opacity-0 pointer-events-none flex flex-col items-center">
                        <span id="victory-emoji">🥔</span>
                        <span id="victory-text" class="text-2xl font-black bg-black/85 px-4 py-1 rounded-full text-yellow-300 mt-2 border border-yellow-400 font-game shadow-lg">土豆</span>
                    </div>
                </div>
            </div>

            <!-- 3. 底部控制栏：控制台、麦克风指示、手动操作 -->
            <div class="p-4 bg-gradient-to-t from-black/90 via-black/70 to-transparent space-y-3 pb-8 pointer-events-auto">
                
                <!-- 状态提示 -->
                <div class="flex items-center justify-center space-x-2 text-sm text-center py-1">
                    <span class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500" id="status-dot"></span>
                    </span>
                    <span class="text-emerald-300 font-medium" id="status-text">麦克风已就绪，等待读音...</span>
                </div>

                <!-- 教师/学生操作区域 -->
                <div class="flex justify-between items-center gap-2 w-full">
                    <!-- 左：手动判定错 -->
                    <button id="btn-wrong" class="flex-1 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white py-3 rounded-2xl flex items-center justify-center space-x-1 font-bold shadow-lg transition-all border-b-4 border-rose-800">
                        <i data-lucide="x-circle"></i>
                        <span>判定错 (Esc)</span>
                    </button>
                    <!-- 中：切换裁判/语音模式 -->
                    <button id="btn-mode-toggle" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-2xl flex items-center justify-center shadow-lg transition-all" title="切换模式">
                        <i data-lucide="mic" id="mode-icon"></i>
                    </button>
                    <!-- 右：手动判定对 -->
                    <button id="btn-correct" class="flex-[1.5] bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white py-3 rounded-2xl flex items-center justify-center space-x-1 font-bold shadow-lg transition-all border-b-4 border-emerald-700">
                        <i data-lucide="check-circle"></i>
                        <span>判定对 (Space)</span>
                    </button>

                    <!-- 学生语音模式提示条 -->
                    <div id="voice-status-container" class="hidden flex-1 bg-gradient-to-r from-indigo-600 to-blue-500 text-white py-3 px-4 rounded-2xl flex items-center justify-center space-x-2 font-bold shadow-lg border-b-4 border-indigo-800 animate-pulse">
                        <span class="relative flex h-2.5 w-2.5">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-white"></span>
                        </span>
                        <span id="voice-status-lbl" class="text-sm font-game tracking-wider">🎤 请大声读出拼音...</span>
                    </div>
                </div>

                <div class="text-[10px] text-center text-slate-400">
                    语音识别仅支持 Chrome/Edge 浏览器。支持教师手动裁判模式。
                </div>
            </div>
        </div>

        <!-- 遮罩层：游戏未开始 / 游戏成功 / 失败 -->
        <div id="overlay-screen" class="absolute inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-between p-6 text-center font-game">
            
            <!-- 顶部装饰 -->
            <div class="mt-8">
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-orange-400 to-red-500 tracking-wider font-game drop-shadow-md">
                    拼音大挑战
                </h1>
                <p class="text-sm text-slate-400 mt-2 uppercase tracking-widest">Pinyin Challenge Game</p>
            </div>

            <!-- 主内容区 -->
            <div id="overlay-content" class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
                <div class="text-5xl" id="overlay-emoji">🎮</div>
                <h2 class="text-2xl font-bold text-white font-game" id="overlay-title">挑战开始！</h2>
                <div id="overlay-desc" class="text-sm text-slate-300 leading-relaxed font-sans">
                    请大声读出屏幕上的拼音。如果发音和声调都正确，滑动的挡门墙就会开启！
                </div>

                <!-- 游戏配置 -->
                <div class="space-y-3 pt-2 text-left font-sans" id="game-setup">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">选择词库类型</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="cat-btn py-2.5 px-3 rounded-xl border-2 border-yellow-500 bg-yellow-500/10 text-yellow-300 text-sm font-semibold transition-all flex items-center justify-center space-x-1" data-cat="veggies">
                            <span>🥔 蔬菜水果</span>
                        </button>
                        <button class="cat-btn py-2.5 px-3 rounded-xl border-2 border-slate-700 hover:border-slate-500 bg-slate-800/50 text-slate-300 text-sm font-semibold transition-all flex items-center justify-center space-x-1" data-cat="animals">
                            <span>🦁 趣味动物</span>
                        </button>
                    </div>
                    
                    <div class="flex items-center space-x-2 pt-2">
                        <input type="checkbox" id="use-camera" class="w-4 h-4 rounded text-blue-600 bg-slate-800 border-slate-700 focus:ring-blue-500" checked>
                        <label for="use-camera" class="text-xs text-slate-300 cursor-pointer">开启摄像头（模拟AR滤镜效果）</label>
                    </div>
                </div>
            </div>

            <!-- 开始/重来按钮 -->
            <button id="btn-start" class="w-full max-w-xs bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-500 hover:to-amber-600 active:scale-95 text-slate-950 font-black text-xl py-4 rounded-2xl shadow-lg shadow-yellow-500/20 tracking-widest transition-all mb-8 border-b-4 border-amber-700 flex items-center justify-center space-x-2 font-game">
                <i data-lucide="play-circle" class="w-6 h-6 fill-current"></i>
                <span id="btn-start-text">开始挑战</span>
            </button>
        </div>

    </div>

    <!-- 脚本逻辑 -->
    <script>
        // 游戏词库数据
        const wordBanks = {
            veggies: [
                { 
                    word: '土豆', pinyin: 'tǔ dòu', emoji: '🥔',
                    tones: {
                        '吐 du': '变成 吐都 😢 啦，‘豆’要读第四声哦！',
                        '吐都': '变成 吐都 😢 啦，‘豆’要读第四声哦！',
                        '兔兜': '哎呀，声调全跑偏啦，变成 兔兜 😭 啦！',
                        '图都': '注意声调！那是 图都 🥺 噢！'
                    }
                },
                { 
                    word: '西兰花', pinyin: 'xī lán huā', emoji: '🥦',
                    tones: {
                        '西蓝画': '注意最后一个字是第一声哦 😢！',
                        '细兰花': '‘西’是一声 (xī)，不要读成四声的 细 😭 噢！'
                    }
                },
                { 
                    word: '西红柿', pinyin: 'xī hóng shì', emoji: '🍅',
                    tones: {
                        '西红十': '注意！是柿子(shì)，不是数字十(shí) 🥺！',
                        '细红柿': '‘西’是一声 (xī)，注意声调 😭！'
                    }
                },
                { 
                    word: '西瓜', pinyin: 'xī guā', emoji: '🍉',
                    tones: {
                        '细挂': '西瓜不是 细挂 😢 噢！'
                    }
                },
                { 
                    word: '香蕉', pinyin: 'xiāng jiāo', emoji: '🍌',
                    tones: {
                        '想叫': '天哪，变成 想叫 😭 啦！都是第一声平声唷！',
                        '相脚': '‘蕉’是平声，不是脚(jiǎo) 🥺！'
                    }
                },
                { 
                    word: '胡萝卜', pinyin: 'hú luó bo', emoji: '🥕',
                    tones: {
                        '户落破': '读太重啦，‘萝卜’要读轻声 😢！',
                        '虎萝卜': '‘胡’是二声，不是老虎的虎(hǔ) 😭！'
                    }
                },
                { 
                    word: '玉米', pinyin: 'yù mǐ', emoji: '🌽',
                    tones: {
                        '鱼米': '‘玉’是第四声 (yù) 唷 🥺！'
                    }
                },
                { 
                    word: '草莓', pinyin: 'cǎo méi', emoji: '🍓',
                    tones: {
                        '吵妹': '哈哈，‘草莓’听起来像 吵妹 😭 了！',
                        '超美': '虽然超美，但‘草’是三声(cǎo)哦 🥺！'
                    }
                },
                { 
                    word: '菠萝', pinyin: 'bō luó', emoji: '🍍',
                    tones: {
                        '波落': '变成 波落 😢 啦，‘萝’是二声(luó)哦！',
                        '博落': '声调跑偏啦 😭！'
                    }
                },
                { 
                    word: '苹果', pinyin: 'píng guǒ', emoji: '🍎',
                    tones: {
                        '病国': '不要读成四声的 病国 😭 噢！',
                        '凭国': '‘果’是第三声(guǒ)哦 🥺！'
                    }
                }
            ],
            animals: [
                { 
                    word: '老虎', pinyin: 'lǎo hǔ', emoji: '🐯',
                    tones: {
                        '老夫': '老虎变成 老夫 🥺 啦！',
                        '落户': '声调跑偏啦，变成 落户 😢 了！'
                    }
                },
                { 
                    word: '熊猫', pinyin: 'xióng māo', emoji: '🐼',

        // 初始化

        // 声音播放
        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.warn('AudioContext not supported');
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'explosion') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.5);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'slide') {
                // 🔊 浑厚的滑动门声效
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(75, now);
                osc.frequency.linearRampToValueAtTime(130, now + 0.5);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'fanfare') {
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const oscNote = audioCtx.createOscillator();
                    const gainNote = audioCtx.createGain();
                    oscNote.connect(gainNote);
                    gainNote.connect(audioCtx.destination);
                    oscNote.type = 'sine';
                    oscNote.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gainNote.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gainNote.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.4);
                    oscNote.start(now + idx * 0.08);
                    oscNote.stop(now + idx * 0.08 + 0.5);
                });
            }
        }

        // 初始化语音识别
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.warn('Speech Recognition not supported in this browser.');
                updateStatus('语音识别在此浏览器不可用，已自动开启手动演示模式', 'warn');
                enableManualMode(true);
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'zh-CN';

            recognition.onstart = () => {
                isListening = true;
                if (!isManualMode) {
                    updateStatus('正在倾听发音中...大声说出来吧！', 'success');
                    animateFace('listening');
                }
            };

            recognition.onerror = (e) => {
                console.error('Speech recognition error:', e.error);
                if (e.error === 'not-allowed') {
                    updateStatus('未获取麦克风权限，请点击允许或换用手动模式', 'warn');
                }
            };

            recognition.onend = () => {
                isListening = false;
                if (isPlaying && !isManualMode) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error(e);
                    }
                }
            };

            recognition.onresult = (event) => {
                if (!isPlaying || isManualMode) return;

                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                if (interimTranscript.length > 0 || finalTranscript.length > 0) {
                    animateFace('speaking');
                    const text = finalTranscript || interimTranscript;
                    
                    // 去除多余标点和空格
                    const cleanText = text.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。！，\s]/g, "");
                    // 彻底移除双引号 “ 和 ” 包裹，避免空间不足被截断
                    elements.speechTranscript.innerText = cleanText;
                    elements.speechTranscript.className = "text-lg font-black text-center tracking-wide text-yellow-300 leading-normal";

                    checkSpeechAnswer(cleanText);
                }
            };
        }

        // 检验拼音发音以及声调
        function checkSpeechAnswer(speechText) {
            const currentItem = currentWords[currentWordIndex];
            if (!currentItem) return;

            // 1. 如果完全读对（代表发音与声调都准确）
            if (speechText.includes(currentItem.word)) {
                elements.speechErrorHint.classList.add('hidden');
                handleCorrectAnswer();
                return;
            }

            // 2. 智能声调报错过滤
            for (let errorWord in currentItem.tones) {
                if (speechText.includes(errorWord)) {
                    elements.speechErrorHint.innerText = `⚠️ ${currentItem.tones[errorWord]}`;
                    elements.speechErrorHint.classList.remove('hidden');
                    handleWrongAnswer(currentItem.tones[errorWord]); 
                    return;
                }
            }

            // 3. 声调或拼音完全不着边际
            if (speechText.length >= currentItem.word.length) {
                elements.speechErrorHint.innerText = `⚠️ 声调/读音不对哦 🥺，大声重试！`;
                elements.speechErrorHint.classList.remove('hidden');
                handleWrongAnswer();
            }
        }

        // 创建飘字反馈
        function spawnFeedbackText(isCorrect, customText = "") {
            elements.textFeedbackContainer.innerHTML = '';
            const textSpan = document.createElement('div');
            
            let feedbackText = "";
            if (isCorrect) {
                feedbackText = encouragementPool[Math.floor(Math.random() * encouragementPool.length)];
                textSpan.className = "feedback-pop text-2xl font-black px-4 py-2 bg-emerald-500 text-white rounded-full border-2 border-white shadow-lg font-game tracking-wide";
            } else {
                feedbackText = customText || teasePool[Math.floor(Math.random() * teasePool.length)];
                textSpan.className = "feedback-pop text-lg font-black px-4 py-2 bg-rose-600 text-white rounded-full border-2 border-white shadow-lg font-game tracking-wide text-center max-w-[90%]";
            }

            textSpan.innerText = feedbackText;
            elements.textFeedbackContainer.appendChild(textSpan);

            setTimeout(() => {
                textSpan.remove();
            }, 2000);
        }

        // 事件监听 Setup
        function setupEventListeners() {
            elements.btnStart.onclick = () => {
                initAudio();
                startGame();
            };

            // 顶部栏随时重置并返回主配置遮罩
            elements.btnRestartMid.onclick = () => {
                resetGameToMainScreen();
            };

            // 手动判定正确：触发爆炸倒墙，进入下一个
            elements.btnCorrect.onclick = () => {
                if (isPlaying) handleCorrectAnswer();
            };

            // 手动判定错：扣心、震动、重置本题时间重新挑战 (绝不跳过)
            elements.btnWrong.onclick = () => {
                if (isPlaying) handleWrongAnswer();
            };

            elements.btnModeToggle.onclick = () => {
                enableManualMode(!isManualMode);
            };

            const catButtons = document.querySelectorAll('.cat-btn');
            catButtons.forEach(btn => {
                btn.onclick = () => {
                    catButtons.forEach(b => {
                        b.classList.remove('border-yellow-500', 'bg-yellow-500/10', 'text-yellow-300');
                        b.classList.add('border-slate-700', 'bg-slate-800/50', 'text-slate-300');
                    });
                    btn.classList.add('border-yellow-500', 'bg-yellow-500/10', 'text-yellow-300');
                    btn.classList.remove('border-slate-700', 'bg-slate-800/50', 'text-slate-300');
                    activeBank = btn.dataset.cat;
                };
            });

            document.addEventListener('keydown', (e) => {
                if (!isPlaying) return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    handleCorrectAnswer();
                } else if (e.code === 'Escape') {
                    e.preventDefault();
                    handleWrongAnswer();
                }
            });
        }

        // 随时重开回到主屏逻辑
        function resetGameToMainScreen() {
            isPlaying = false;
            clearInterval(timerInterval);
            stopWebcam();

            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }

            // 重新显示设置区
            elements.gameSetup.classList.remove('hidden');

            // 合拢两扇挡门（通过原生 JS style 赋值）
            elements.wallGateLeft.style.transform = 'translateX(0)';
            elements.wallGateRight.style.transform = 'translateX(0)';

            // 还原遮罩配置为初始状态
            elements.overlayEmoji.innerText = "🎮";
            elements.overlayTitle.innerText = "挑战开始！";
            elements.overlayDesc.innerText = "请大声读出屏幕上的拼音。如果发音和声调都正确，大门墙就会开启！";
            elements.btnStartText.innerText = "开始挑战";

            animateFace('normal');
            elements.overlayScreen.classList.remove('hidden');
        }

        // 切换裁判模式与语音识别状态
        function enableManualMode(enable) {
            isManualMode = enable;
            const btnWrong = elements.btnWrong;
            const btnCorrect = elements.btnCorrect;
            const voiceStatusContainer = elements.voiceStatusContainer;

            if (isManualMode) {
                elements.modeIcon.setAttribute('data-lucide', 'keyboard');
                elements.btnModeToggle.classList.add('bg-emerald-600/30', 'text-emerald-300', 'border', 'border-emerald-500/50');
                updateStatus('已进入教师手动裁判模式（键盘空格对，Esc错）', 'normal');
                elements.speechPreviewBox.classList.add('hidden');
                
                // 教师模式下，展现判定按键
                btnWrong.classList.remove('hidden');
                btnCorrect.classList.remove('hidden');
                voiceStatusContainer.classList.add('hidden');

                if (recognition) {
                    try { recognition.stop(); } catch(e){}
                }
            } else {
                elements.modeIcon.setAttribute('data-lucide', 'mic');
                elements.btnModeToggle.classList.remove('bg-emerald-600/30', 'text-emerald-300', 'border', 'border-emerald-500/50');
                updateStatus('正在尝试启动语音识别...', 'normal');
                elements.speechPreviewBox.classList.remove('hidden');

                // 学生语音模式下，隐藏判定按键，避免随意点击直接跳过
                btnWrong.classList.add('hidden');
                btnCorrect.classList.add('hidden');
                voiceStatusContainer.classList.remove('hidden');

                startVoiceListening();
            }
            lucide.createIcons();
        }

        function startVoiceListening() {
            if (recognition && !isListening && isPlaying && !isManualMode) {
                try {
                    recognition.start();
                } catch (e) {
                    console.error(e);
                }
            }
        }

        function updateStatus(text, type = 'normal') {
            elements.statusText.innerText = text;
            elements.statusDot.className = "relative inline-flex rounded-full h-3 w-3 ";
            if (type === 'success') {
                elements.statusDot.classList.add('bg-emerald-500');
                elements.statusText.className = 'text-emerald-300 font-medium';
            } else if (type === 'warn') {
                elements.statusDot.classList.add('bg-rose-500');
                elements.statusText.className = 'text-rose-400 font-medium';
            } else {
                elements.statusDot.classList.add('bg-blue-500');
                elements.statusText.className = 'text-blue-300 font-medium';
            }
        }

        function startGame() {
            score = 0;
            lives = 3;
            currentWordIndex = 0;
            isPlaying = true;
            elements.score.innerText = score;
            elements.textFeedbackContainer.innerHTML = '';
            elements.speechTranscript.innerText = "等待发音...";
            elements.speechTranscript.className = "text-lg font-bold text-center tracking-wide text-slate-300";
            elements.speechErrorHint.classList.add('hidden');
            
            updateHeartsUI();

            currentWords = [...wordBanks[activeBank]].sort(() => Math.random() - 0.5);
            elements.overlayScreen.classList.add('hidden');

            if (elements.useCamera.checked) {
                startWebcam();
            } else {
                stopWebcam();
            }

            enableManualMode(isManualMode);
            loadWord();
        }

        // 加载词语并播放滑门动画
        function loadWord() {
            if (currentWordIndex >= currentWords.length) {
                // 如果答通了全部，触发胜利结算
                showGameWonScreen();
                return;
            }

            const currentItem = currentWords[currentWordIndex];

            // 1. 关闭挡门墙（使用安全的 JS style 原生赋值）
            elements.wallGateLeft.style.transform = 'translateX(0)';
            elements.wallGateRight.style.transform = 'translateX(0)';

            // 隐藏上一个爆出的胜利实物
            elements.victoryItem.className = "absolute bottom-6 z-30 text-8xl transition-all duration-700 transform scale-0 opacity-0 pointer-events-none flex flex-col items-center";

            // 清理已有的倒计时
            clearInterval(timerInterval);
            elements.timerBar.style.width = '100%';

            // 2. 延迟加载数据并开门（在门完全闭合后重开，展现完美顺畅的动态效果）
            setTimeout(() => {
                elements.targetPinyin.innerText = currentItem.pinyin;
                elements.targetEmoji.innerText = currentItem.emoji;
                elements.wordLen.innerText = currentItem.word.length;

                // 播放石门滑开声效
                playSound('slide');

                // 左右滑门拉开（利用内联样式直接驱动，100% 成功开门！）
                elements.wallGateLeft.style.transform = 'translateX(-101%)';
                elements.wallGateRight.style.transform = 'translateX(101%)';

                // 开门动画完成后（约600ms），才启动学生的答题倒计时，保证绝不浪费时间
                setTimeout(() => {
                    if (isPlaying) {
                        resetWordTimer();
                    }
                }, 600);

            }, 400); 

            animateFace('normal');
        }

        // 重置倒计时（允许学生在同一题原地复活挑战）
        function resetWordTimer() {
            timeLeft = wordTimeLimit;
            updateTimerBar();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                updateTimerBar();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleWrongAnswer("时间到 😢！声调不要犹豫噢！⏳");
                }
            }, 100);
        }

        function updateTimerBar() {
            const percentage = (timeLeft / wordTimeLimit) * 100;
            elements.timerBar.style.width = `${percentage}%`;
            if (percentage < 30) {
                elements.timerBar.className = "absolute top-0 left-0 h-1.5 bg-rose-500 rounded-full transition-all duration-100 ease-linear";
                animateFace('panic');
            } else {
                elements.timerBar.className = "absolute top-0 left-0 h-1.5 bg-yellow-400 rounded-full transition-all duration-100 ease-linear";
            }
        }

        // 判定正确 (破门开箱成功，获得水果/动物并展示在下方蓝色垫子上)
        function handleCorrectAnswer() {
            clearInterval(timerInterval);
            playSound('success');
            playSound('explosion');

            const currentItem = currentWords[currentWordIndex];

            // 下方蓝色赛道上直接爆出高保真的可爱 Emoji 实物
            elements.victoryEmoji.innerText = currentItem.emoji;
            elements.victoryText.innerText = currentItem.word;
            elements.victoryItem.className = "absolute bottom-12 z-30 text-8xl transform scale-125 opacity-100 pointer-events-none flex flex-col items-center transition-all duration-500 ease-out";

            score += 10;
            elements.score.innerText = score;

            // 鼓励飘字与动态表情
            spawnFeedbackText(true);
            animateFace('happy');

            // 答对后 1.8 秒后载入下一个拼音卡
            setTimeout(() => {
                currentWordIndex++;
                elements.speechTranscript.innerText = "等待发音...";
                elements.speechTranscript.className = "text-lg font-bold text-center tracking-wide text-slate-300";
                elements.speechErrorHint.classList.add('hidden');
                loadWord();
            }, 1800);
        }

        // 判定错误 (扣分/扣心，不跳过当前题，橘黄色显示卡剧烈抖动)
        function handleWrongAnswer(customHintText = "") {
            clearInterval(timerInterval);
            playSound('error');

            // 拼音橘黄展示卡发生剧烈颤抖（完美的交互反馈）
            elements.orangeDisplayCard.classList.add('shake-error');
            setTimeout(() => {
                elements.orangeDisplayCard.classList.remove('shake-error');
            }, 400);

            lives = Math.max(0, lives - 1); // 扣心
            updateHeartsUI();

            // 触发趣味伤心弹幕
            spawnFeedbackText(false, customHintText);
            animateFace('angry');

            // 重置倒计时，学生在当前题上可以进行二次发音纠正
            setTimeout(() => {
                resetWordTimer();
                animateFace('normal');
            }, 1500);
        }

        // 更新生命值 UI
        function updateHeartsUI() {
            elements.heartsContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('i');
                heart.setAttribute('data-lucide', 'heart');
                if (i < lives) {
                    heart.className = 'text-rose-500 fill-rose-500 w-5 h-5';
                } else {
                    heart.className = 'text-slate-600 w-5 h-5';
                }
                elements.heartsContainer.appendChild(heart);
            }
            lucide.createIcons();
        }

        // 终极通关：大奖杯大拇指庆典，增添“返回主菜单 (Back to Menu)”专属交互
        function showGameWonScreen() {
            isPlaying = false;
            clearInterval(timerInterval);
            stopWebcam();

            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }

            // 隐藏底部的游戏设置选单，防止推开界面高度
            elements.gameSetup.classList.add('hidden');

            elements.overlayEmoji.innerText = "🏆";
            elements.overlayTitle.innerText = "祝贺你挑战成功！";
            elements.overlayDesc.innerHTML = `
                <div class="flex flex-col items-center space-y-4 py-2">
                    <span class="text-8xl animate-bounce">🏆👍</span>
                    <p class="text-xl font-bold text-yellow-300 font-game">发音精准！拼音通关！</p>
                    <p class="text-sm text-slate-300 mb-2">你获得：<strong class="text-yellow-400 text-lg">${score}</strong> 积分</p>
                    
                    <!-- 极其醒目、高优先级的卡片内专属“返回主菜单”交互按钮，点击后平滑返回最开端的游戏配置页 -->
                    <button id="btn-play-again-inner" class="w-full max-w-[240px] bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-500 hover:to-green-600 active:scale-95 text-slate-950 font-black text-lg py-3 px-6 rounded-2xl shadow-lg shadow-emerald-500/20 tracking-wider transition-all border-b-4 border-green-700 flex items-center justify-center space-x-2 font-game pointer-events-auto">
                        <i data-lucide="home" class="w-5 h-5"></i>
                        <span>返回主菜单</span>
                    </button>
                </div>
            `;
            elements.btnStartText.innerText = "返回主菜单"; // 同时改变下方主按钮文本

            animateFace('happy');
            playSound('fanfare'); // 播放激昂的凯旋 fanfare
            elements.overlayScreen.classList.remove('hidden');

            // 动态刷新图标
            lucide.createIcons();

            // 绑定全新增加的内部中心按钮点击事件，返回最开端
            const playAgainBtn = document.getElementById('btn-play-again-inner');
            if (playAgainBtn) {
                playAgainBtn.onclick = () => {
                    resetGameToMainScreen();
                };
            }
            // 主开始按钮点击在结算页中时同样也绑定为返回主屏
            elements.btnStart.onclick = () => {
                resetGameToMainScreen();
                // 还原开始按钮本意绑定
                elements.btnStart.onclick = () => {
                    initAudio();
                    startGame();
                };
            };
        }

        // 摄像头
        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 480, height: 640, facingMode: 'user' }, 
                    audio: false 
                });
                elements.webcam.srcObject = stream;
                elements.webcam.classList.remove('hidden');
                elements.fallbackBg.classList.add('opacity-40');
            } catch (err) {
                console.warn("无法打开摄像头:", err);
                stopWebcam();
            }
        }

        // 关闭摄像头
        function stopWebcam() {
            if (elements.webcam.srcObject) {
                const tracks = elements.webcam.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                elements.webcam.srcObject = null;
            }
            elements.webcam.classList.add('hidden');
            elements.fallbackBg.classList.remove('opacity-40');
        }

        // 卡米拉颜表情
        function animateFace(state) {
            const mouth = faceParts.mouth;
            const face = faceParts.face;
            
            face.style.transform = "scale(1)";
            faceParts.leftBrow.setAttribute('d', 'M25,30 Q35,28 42,35');
            faceParts.rightBrow.setAttribute('d', 'M75,30 Q65,28 58,35');

            switch (state) {
                case 'normal':
                    mouth.setAttribute('d', 'M35,62 Q50,62 65,62');
                    elements.reactionBubble.innerText = "加油！发准声调！";
                    elements.reactionBubble.className = "text-[10px] text-pink-300 font-semibold text-center mt-1 h-8 flex items-center justify-center";
                    break;
                case 'listening':
                    mouth.setAttribute('d', 'M40,62 Q50,65 60,62');
                    elements.reactionBubble.innerText = "倾听中👂...";
                    break;
                case 'speaking':
                    mouth.setAttribute('d', 'M25,58 Q50,85 75,58 Q50,45 25,58'); 
                    face.style.transform = "scale(1.1)";
                    elements.reactionBubble.innerText = "大声点！";
                    break;
                case 'happy':
                    mouth.setAttribute('d', 'M30,55 Q50,75 70,55');
                    faceParts.leftBrow.setAttribute('d', 'M25,28 Q35,23 42,28');
                    faceParts.rightBrow.setAttribute('d', 'M75,28 Q65,23 58,28');
                    elements.reactionBubble.innerText = "好标准！🎉";
                    elements.reactionBubble.className = "text-[12px] text-emerald-400 font-bold text-center mt-1 h-8 flex items-center justify-center";
                    break;
                case 'panic':
                    mouth.setAttribute('d', 'M40,60 Q50,75 60,60 Q50,55 40,60');
                    faceParts.leftBrow.setAttribute('d', 'M25,35 Q35,32 42,28');
                    faceParts.rightBrow.setAttribute('d', 'M75,35 Q65,32 58,28');
                    elements.reactionBubble.innerText = "时间不够啦！💥";
                    elements.reactionBubble.className = "text-[10px] text-red-400 font-bold text-center mt-1 h-8 flex items-center justify-center animate-pulse";
                    break;
                case 'angry':
                    mouth.setAttribute('d', 'M35,68 Q50,55 65,68');
                    faceParts.leftBrow.setAttribute('d', 'M25,35 Q35,33 42,42');
                    faceParts.rightBrow.setAttribute('d', 'M75,35 Q65,33 58,42');
                    face.style.transform = "scale(1.1)";
                    elements.reactionBubble.innerText = "声调不对 😭";
                    elements.reactionBubble.className = "text-[11px] text-orange-400 font-bold text-center mt-1 h-8 flex items-center justify-center";
                    break;
                case 'dead':
                    mouth.setAttribute('d', 'M35,68 Q50,55 65,68');
                    faceParts.leftBrow.setAttribute('d', 'M25,38 Q35,35 42,44');
                    faceParts.rightBrow.setAttribute('d', 'M75,38 Q65,35 58,44');
                    elements.reactionBubble.innerText = "加油啊！😭";
                    elements.reactionBubble.className = "text-[12px] text-rose-500 font-black text-center mt-1 h-8 flex items-center justify-center";
                    break;
            }
        }
    </script>
</body>
</html>
